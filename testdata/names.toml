# Name corpus for output naming (C-16; 05 §C-16 "Done when").
#
# Names only, no media: `tests/naming/test_corpus.py` resolves each `path` with the real
# guessit and the default naming options, and compares the result with the expectations.
# Add your own library's names here to tune the parser.
#
# Keys of a case:
#   category  movie · movie-folder · episode · multi-episode · anime · year-in-show ·
#             no-separators · season-pack · daily · plex
#   path      The source file, relative to a media root. A path with a folder is resolved
#             under the root `/library` (generic-folder skipping stops there); a bare file
#             name has no folder at all.
#   siblings  Other files in the file's folder (season packs). Default: none.
#   source    The expected name source: "file" or "folder". Optional.
#   main_title  The expected {main_title}. Always given.
#   fields    Other expected parsed fields (ParsedName names): name, sub_title, season,
#             episode, episodes, episode_code, year, edition, source_type, release_group.
#             A field that is not listed is not checked; `""` means "not recognised".
#   output    Optional: the expected file name with the default template {main_title}.

# --------------------------------------------------------------------------- 03 §Examples

[[case]]
category = "movie-folder"
path = "Hacksaw.Ridge.2016.HYBRID.2160p.UHD.BluRay.REMUX.TrueHD.7.1.Atmos.DoVi.HDR.HEVC.HUN-HenDerson/hacksawridge.2160p.remux-henderson.mkv"
source = "folder"
main_title = "Hacksaw.Ridge"
fields = { name = "Hacksaw.Ridge", year = 2016, source_type = "UHD.BluRay", release_group = "HenDerson", sub_title = "", season = "", episode = "", edition = "" }
output = "Hacksaw.Ridge.mkv"

[[case]]
category = "season-pack"
path = "The.Sopranos.S03.1080p.BluRay.REMUX-Kataklysm/The.Sopranos.S03E02.Proshai.Livushka.1080p.BluRay.REMUX-Kataklysm.mkv"
