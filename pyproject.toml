# uv workspace root. It is not a package itself: it holds the shared dev tools and the
# ruff / mypy / pytest configuration for every package under packages/.

[tool.uv.workspace]
members = ["packages/reframe", "packages/reframe-server"]

[tool.uv.sources]
reframe = { workspace = true }
reframe-server = { workspace = true }

[dependency-groups]
dev = [
    "reframe[cli]",
    "reframe-server",
    "anyio>=4.15.1",
    "hypothesis>=6.169.0",
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
    "syrupy>=6.1.1",
    "types-psutil>=7.2.2.20260906",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/reframe/src", "packages/reframe-server/src", "testing", "scripts", "desktop/spike/scripts", "desktop/sidecar"]
extend-exclude = ["frontend", "desktop/spike/src-tauri", "desktop/spike/ui", "docs", "*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "PIE",   # misc
    "RUF",   # ruff-specific
    "ASYNC", # async pitfalls
    "PT",    # pytest style
]

[tool.ruff.lint.isort]
known-first-party = ["reframe", "reframe_server", "reframe_testing"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/reframe/src", "packages/reframe-server/src", "testing"]
explicit_package_bases = true
files = [
    "packages/reframe/src",
    "packages/reframe/tests",
    "packages/reframe-server/src",
    "packages/reframe-server/tests",
    "testing",
    "scripts",
    "desktop/spike/scripts",
    "desktop/sidecar",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["packages/reframe/tests", "packages/reframe-server/tests", "testing/tests"]
# testing/ holds shared test infrastructure (fake FFmpeg, fixture media helpers) used by the
# core, server and end-to-end tests: import it as `reframe_testing`.
pythonpath = ["testing"]
# -p: fixtures `fixture_media` and `fake_tools`, and the needs_ffmpeg auto-skip, for every test.
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-p",
    "reframe_testing.pytest_plugin",
    # pytest-xdist: every run is parallel (decision 0084); `-n 0` runs in one process.
    "-n",
    "auto",
    "--dist",
    "worksteal",
]
xfail_strict = true
markers = [
    "slow: long-running test (seconds, not milliseconds)",
    "needs_ffmpeg: needs a real ffmpeg/ffprobe (and the generated fixtures in testdata/media)",
    "needs_gpu: needs a real GPU encoder; never run in CI",
    "needs_mkvtoolnix: uses mkvmerge, mkvinfo and mkvpropedit as a test oracle (skipped without them)",
    "benchmark: performance budget check; runs in the non-blocking CI benchmark job",
]
# A hung test ends its worker after 600 s and xdist starts a new one. "thread" is the only method
# that works on Windows and does not need the main thread to get back to Python. Under xdist only
# faulthandler's dump (a little earlier) reaches the terminal.
timeout = 600
timeout_method = "thread"
faulthandler_timeout = 590
filterwarnings = [
    "error",
    # syrupy warns at session end after a worker crash; as an error it would hide the summary.
    "ignore:syrupy:UserWarning",
]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["reframe", "reframe_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.\\s*$"]
