# uv workspace root. It is not a package itself: it holds the shared dev tools and the
# ruff / mypy / pytest configuration for every package under packages/.

[tool.uv.workspace]
members = ["packages/reframe", "packages/reframe-server"]

[tool.uv.sources]
reframe = { workspace = true }
reframe-server = { workspace = true }

[dependency-groups]
dev = [
    "reframe[cli,mediainfo]",
    "reframe-server",
    "anyio>=4.15.1",
    "hypothesis>=6.169.2",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "syrupy>=6.1.1",
    "types-psutil>=7.2.2.20260906",
]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/reframe/src", "packages/reframe-server/src", "testing", "scripts"]
extend-exclude = ["frontend", "desktop", "docs", "*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "PIE",   # misc
    "RUF",   # ruff-specific
    "ASYNC", # async pitfalls
    "PT",    # pytest style
]

[tool.ruff.lint.isort]
known-first-party = ["reframe", "reframe_server", "reframe_testing"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/reframe/src", "packages/reframe-server/src", "testing"]
explicit_package_bases = true
files = [
    "packages/reframe/src",
    "packages/reframe/tests",
    "packages/reframe-server/src",
    "packages/reframe-server/tests",
    "testing",
    "scripts",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["packages/reframe/tests", "packages/reframe-server/tests", "testing/tests"]
# testing/ holds shared test infrastructure (fake FFmpeg, fixture media helpers) used by the
# core, server and end-to-end tests: import it as `reframe_testing`.
pythonpath = ["testing"]
# -p: fixtures `fixture_media` and `fake_tools`, and the needs_ffmpeg auto-skip, for every test.
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-p",
    "reframe_testing.pytest_plugin",
]
xfail_strict = true
markers = [
    "slow: long-running test (seconds, not milliseconds)",
    "needs_ffmpeg: needs a real ffmpeg/ffprobe (and the generated fixtures in testdata/media)",
    "needs_gpu: needs a real GPU encoder; never run in CI",
    "benchmark: performance budget check (09 Q-3); runs in the non-blocking CI benchmark job",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["reframe", "reframe_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.\\s*$"]
