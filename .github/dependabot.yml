# Dependency updates (Q-1.3). Weekly; minor and patch updates are grouped into one PR per
# ecosystem, major updates come as separate PRs.
# Cargo (desktop/src-tauri) is added with D-1, when the Tauri crate exists.
version: 2
updates:
  # uv workspace: pyproject.toml files + uv.lock at the repository root.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors held back on purpose: docs/decisions/0003-frontend-held-back-majors.md
    ignore:
      - dependency-name: primevue # PrimeVue 5+ has a proprietary licence
        versions: [">=5.0.0"]
      - dependency-name: "@primeuix/themes" # 3+ belongs to PrimeVue 5
        versions: [">=3.0.0"]
      - dependency-name: typescript # vue-tsc does not run on TypeScript 7
        versions: [">=7.0.0"]

  # The actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
