# Dependency audits (Q-1.3): known vulnerabilities in the locked Python and npm dependencies.
# Runs on PRs and main, and weekly, so a new advisory for an unchanged lock file is found too.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  pip-audit:
    name: pip-audit (uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # pip-audit is pinned in the dev group of uv.lock.
      - run: uv sync --frozen

      # Every locked package of every platform, extra and group. The workspace packages are not
      # on PyPI, so they are left out. Environment markers are removed so that platform-only
      # packages (for example colorama on Windows) are audited too.
      - name: Export the locked requirements
        run: |
          uv export --frozen --no-emit-workspace --no-hashes --all-extras --all-groups \
            --format requirements-txt --quiet --output-file "$RUNNER_TEMP/requirements-markers.txt"
          sed -E 's/ ; .*$//' "$RUNNER_TEMP/requirements-markers.txt" > "$RUNNER_TEMP/requirements.txt"

      # Fails on any known vulnerability (PyPI advisories have no reliable severity), and with
      # --strict also when a package cannot be audited.
      - name: pip-audit
        run: |
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements.txt" \
            --disable-pip --no-deps --strict --progress-spinner off

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      # Reads package-lock.json only (no install). High and critical advisories fail the job.
      - run: npm audit --audit-level=high
