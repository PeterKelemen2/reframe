# CI: the same commands as CLAUDE.md, on Ubuntu and Windows, against the pinned
# FFmpeg build from tools/ffmpeg.toml. Dependency audits are in audit.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a branch or PR. Every run on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # The same scripts on Linux and Windows (Git Bash on the Windows runners).
    shell: bash

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"] # .python-version
        include:
          # requires-python is ">=3.13": test the minimum once.
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
      # A missing or broken ffmpeg/ffprobe fails the needs_ffmpeg tests instead of skipping them.
      REFRAME_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs the Python version from UV_PYTHON (matrix.python).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The build that ships goes where Reframe's tool discovery looks for the bundled
      # build, $REFRAME_DATA_DIR/tools/ffmpeg (reframe/paths.py). It is NOT put on PATH, so
      # the tests and the fixture generator use exactly the binary that discovery picks.
      - name: Point REFRAME_DATA_DIR to a temporary folder
        run: echo "REFRAME_DATA_DIR=$RUNNER_TEMP/reframe-data" >> "$GITHUB_ENV"

      - name: Cache the pinned FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/reframe-data/tools/ffmpeg
          key: tools-${{ runner.os }}-default-bundled-${{ hashFiles('tools/ffmpeg.toml') }}

      # Downloads (or re-verifies the cached copy of) the build that ships, checks the SHA-256
      # and the version, and lays it out as a bundled build (bin/, plus lib/ on Linux).
      - name: Install the pinned FFmpeg as the bundled build (tools/ffmpeg.toml)
        run: >-
          uv run --no-project python scripts/fetch-tools.py --build default
          --install-dir "$REFRAME_DATA_DIR/tools/ffmpeg"

      # `uv sync --frozen` does not check the lock file, so a stale uv.lock fails here.
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Check that every package's version is the core's (scripts/stamp-version.py)
        run: uv run --no-project python scripts/stamp-version.py --check

      - run: uv sync --frozen

      - name: Show the tools that discovery picks (FFmpeg must be the bundled build)
        run: uv run python -m reframe.tools --require ffmpeg,ffprobe --expect-origin bundled

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

      - name: Cache the generated test media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/media
          key: testdata-${{ runner.os }}-py${{ matrix.python }}-default-${{ hashFiles('scripts/make-testdata.py', 'testing/reframe_testing/**/*.py', 'tools/ffmpeg.toml') }}

      - name: Generate the test media (incremental)
        run: uv run python scripts/make-testdata.py

      - run: uv run pytest -m "not needs_gpu and not benchmark"

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint # oxlint
      - run: npm run fmt:check # oxfmt --check
      - run: npm run typecheck # vue-tsc --noEmit on tsconfig.app.json and tsconfig.node.json
      - run: npm test # vitest run
      - run: npm run build:web
      - run: npm run build:desktop

  desktop:
    # The Tauri shell. The Windows runner is the only place where its cfg(windows) code compiles.
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # tauri::generate_context! embeds the desktop frontend, so it must be built first.
      - run: npm ci && npm run build:desktop
        working-directory: frontend
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri

  desktop-smoke:
    # The release app with its frozen sidecar and bundled tools, driven through tauri-driver
    # (desktop/tests/smoke): it starts, reaches its backend, opens a file from argv, finishes a
    # job and quits without leaving processes behind. Ubuntu 22.04 is the oldest supported distro.
    name: Desktop smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # Tauri's libraries; meson, ninja and libdrm for bundle-tools.py's libva build;
      # WebKitWebDriver, Xvfb, and python3-xlib to close the window as a user does. The same
      # list builds desktop/tests/smoke/linux/Dockerfile.
      - name: Tauri's Linux libraries, the libva build tools, WebKitWebDriver and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < desktop/tests/smoke/linux/apt-packages.txt

      - run: uv sync --frozen

      - name: Lay out the bundled tools (tools/ffmpeg.toml, tools/bundled-tools.toml)
        run: uv run python scripts/bundle-tools.py --platform ${{ runner.os == 'Windows' && 'windows-x64' || 'linux-x64' }}

      - name: Build the frozen sidecar
        run: uv run python desktop/sidecar/build.py

      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop

      # The binary next to its resources (sidecar/, tools/), as the installers lay it out.
      - name: Build the release app (no installers)
        run: npx tauri build --no-bundle
        working-directory: desktop

      - name: Install tauri-driver
        run: cargo install --locked tauri-driver@2.1.0

      # A driver of another major version than the WebView2 runtime refuses the session.
      - name: Put the msedgedriver of the runner's WebView2 on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = & desktop/tests/smoke/msedgedriver.ps1 -Dest "$env:RUNNER_TEMP\msedgedriver"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Generate the test file with the bundled FFmpeg
        run: |
          bin="$PWD/desktop/src-tauri/resources/tools/ffmpeg/bin"
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          REFRAME_FFMPEG="$bin/ffmpeg$exe" REFRAME_FFPROBE="$bin/ffprobe$exe" \
            uv run python scripts/make-testdata.py --only multitrack

      - name: Type-check, lint and format-check the smoke test (the frontend's rules)
        run: |
          npm run smoke:typecheck
          ../frontend/node_modules/.bin/oxlint -c ../frontend/.oxlintrc.json --deny-warnings tests/smoke
          ../frontend/node_modules/.bin/oxfmt -c ../frontend/.oxfmtrc.json --check tests/smoke
        working-directory: desktop

      - name: Smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' npm run smoke
        working-directory: desktop

      - name: Smoke test
        if: runner.os == 'Windows'
        run: npm run smoke
        working-directory: desktop

  frontend-server:
    # The frontend against a real reframe-server and a real FFmpeg: the server tests (vitest)
    # and the browser flows (Playwright, Chromium, Firefox and WebKit). Linux only: the tests find the
    # pinned FFmpeg through .tools/ and start the servers with a POSIX shell.
    name: Frontend, npm run ${{ matrix.script }} (ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        script: [test:server, e2e]
    runs-on: ubuntu-latest
    # e2e in three browsers takes about 20 min on the AMD desktop (WebKit alone about 10).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the pinned FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-default-frontend-${{ hashFiles('tools/ffmpeg.toml') }}

      # The servers need an FFmpeg with libx265 (the closest match of an unavailable encoder).
      # The folder goes on PATH for the fixture generator and into REFRAME_TEST_TOOLS_DIR,
      # which the tests and the e2e servers read before .tools/.
      - name: Fetch the pinned FFmpeg
        run: |
          bin_dir="$(uv run --no-project python scripts/fetch-tools.py --build default)"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "REFRAME_TEST_TOOLS_DIR=$bin_dir" >> "$GITHUB_ENV"

      - name: Show the FFmpeg
        run: |
          ffmpeg -version | sed -n 1p
          ffmpeg -hide_banner -encoders | grep -w libx265

      - run: uv sync --frozen

      - name: Cache the generated test media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/media
          key: testdata-${{ runner.os }}-frontend-default-${{ hashFiles('scripts/make-testdata.py', 'testing/reframe_testing/**/*.py', 'tools/ffmpeg.toml') }}

      - name: Generate the test media (incremental)
        run: uv run python scripts/make-testdata.py

      - run: npm ci
        working-directory: frontend

      - name: Install the browsers
        if: matrix.script == 'e2e'
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - run: npm run ${{ matrix.script }}
        working-directory: frontend

  api-contract:
    # The committed TypeScript types must match the server's OpenAPI document.
    name: API contract (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen

      - run: npm ci
        working-directory: frontend

      - name: Regenerate frontend/src/api/schema.d.ts and fail on any difference
        run: scripts/gen-api.sh --check

  ffmpeg-override:
    # The path override (REFRAME_FFMPEG / REFRAME_FFPROBE) with a different FFmpeg build.
    # The build is deliberately NOT on PATH.
    name: FFmpeg override path (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REFRAME_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Cache the override-test FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-override-test-${{ hashFiles('tools/ffmpeg.toml') }}

      - name: Fetch the override-test FFmpeg and point REFRAME_FFMPEG / REFRAME_FFPROBE to it
        run: |
          bin_dir="$(uv run --no-project python scripts/fetch-tools.py --build override-test)"
          {
            echo "REFRAME_FFMPEG=$bin_dir/ffmpeg"
            echo "REFRAME_FFPROBE=$bin_dir/ffprobe"
          } >> "$GITHUB_ENV"

      - name: Show the override
        run: |
          echo "REFRAME_FFMPEG=$REFRAME_FFMPEG"
          echo "REFRAME_FFPROBE=$REFRAME_FFPROBE"
          "$REFRAME_FFMPEG" -version | sed -n 1p
          "$REFRAME_FFPROBE" -version | sed -n 1p

      - run: uv sync --frozen

      - name: Show the tools that discovery picks (FFmpeg must come from the environment)
        run: uv run python -m reframe.tools --require ffmpeg,ffprobe --expect-origin env

      - name: Cache the generated test media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/media
          key: testdata-${{ runner.os }}-override-test-${{ hashFiles('scripts/make-testdata.py', 'testing/reframe_testing/**/*.py', 'tools/ffmpeg.toml') }}

      - name: Generate the test media with the override build (incremental)
        run: uv run python scripts/make-testdata.py

      - name: Tests that need FFmpeg
        # pytest exits with 5 when no test is selected: that is a failure here.
        run: uv run pytest -m "needs_ffmpeg and not needs_gpu and not benchmark"

  benchmark:
    # Performance budgets run as a NON-blocking job. A failure here does not fail the
    # workflow; it is a signal to look at (a later step comments on PRs with regressions).
    name: Benchmarks (${{ matrix.os }}, non-blocking)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      REFRAME_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Point REFRAME_DATA_DIR to a temporary folder
        run: echo "REFRAME_DATA_DIR=$RUNNER_TEMP/reframe-data" >> "$GITHUB_ENV"

      - name: Cache the pinned FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/reframe-data/tools/ffmpeg
          key: tools-${{ runner.os }}-default-bundled-${{ hashFiles('tools/ffmpeg.toml') }}

      - name: Install the pinned FFmpeg as the bundled build (tools/ffmpeg.toml)
        run: >-
          uv run --no-project python scripts/fetch-tools.py --build default
          --install-dir "$REFRAME_DATA_DIR/tools/ffmpeg"

      - run: uv sync --frozen

      - name: Generate the test media (incremental)
        run: uv run python scripts/make-testdata.py

      - name: Performance budgets
        run: uv run pytest -m "benchmark and not needs_gpu" -v
