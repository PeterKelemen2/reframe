# CI (Q-1.1, Q-1.2): the same commands as CLAUDE.md, on Ubuntu and Windows, against the pinned
# FFmpeg build from tools/ffmpeg.toml. Dependency audits are in audit.yml (Q-1.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a branch or PR. Every run on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # The same scripts on Linux and Windows (Git Bash on the Windows runners).
    shell: bash

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs the Python version from .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Cache the pinned FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-default-${{ hashFiles('tools/ffmpeg.toml') }}

      # Downloads (or re-verifies the cached copy of) the build that ships, checks the SHA-256
      # and the version, and puts its bin folder first on PATH.
      # C-1 adds discovery of the bundled build: then these jobs use the bundled-directory
      # location instead of PATH.
      - name: Fetch the pinned FFmpeg (tools/ffmpeg.toml)
        run: |
          bin_dir="$(uv run --no-project python scripts/fetch-tools.py --build default)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Show the FFmpeg on PATH
        run: |
          command -v ffmpeg ffprobe
          ffmpeg -version | sed -n 1p

      # `uv sync --frozen` does not check the lock file, so a stale uv.lock fails here.
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

      - name: Cache the generated test media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/media
          key: testdata-${{ runner.os }}-default-${{ hashFiles('scripts/make-testdata.py', 'testing/reframe_testing/media.py', 'tools/ffmpeg.toml') }}

      - name: Generate the test media (incremental)
        run: uv run python scripts/make-testdata.py

      - run: uv run pytest -m "not needs_gpu"

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint # oxlint
      - run: npm run fmt:check # oxfmt --check
      - run: npm run typecheck # vue-tsc --noEmit
      - run: npm test # vitest run
      - run: npm run build:web

  ffmpeg-override:
    # Q-1.2: the path override (REFRAME_FFMPEG / REFRAME_FFPROBE) with a different FFmpeg build.
    # The build is deliberately NOT on PATH.
    name: FFmpeg override path (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Cache the override-test FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-override-test-${{ hashFiles('tools/ffmpeg.toml') }}

      - name: Fetch the override-test FFmpeg and point REFRAME_FFMPEG / REFRAME_FFPROBE to it
        run: |
          bin_dir="$(uv run --no-project python scripts/fetch-tools.py --build override-test)"
          {
            echo "REFRAME_FFMPEG=$bin_dir/ffmpeg"
            echo "REFRAME_FFPROBE=$bin_dir/ffprobe"
          } >> "$GITHUB_ENV"

      - name: Show the override
        run: |
          echo "REFRAME_FFMPEG=$REFRAME_FFMPEG"
          echo "REFRAME_FFPROBE=$REFRAME_FFPROBE"
          "$REFRAME_FFMPEG" -version | sed -n 1p
          "$REFRAME_FFPROBE" -version | sed -n 1p

      - run: uv sync --frozen

      - name: Cache the generated test media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/media
          key: testdata-${{ runner.os }}-override-test-${{ hashFiles('scripts/make-testdata.py', 'testing/reframe_testing/media.py', 'tools/ffmpeg.toml') }}

      - name: Generate the test media with the override build (incremental)
        run: uv run python scripts/make-testdata.py

      - name: Tests that need FFmpeg
        run: |
          # pytest exits with 5 when no test is selected. Until C-1 adds needs_ffmpeg tests,
          # that is a warning, not a failure.
          status=0
          uv run pytest -m "needs_ffmpeg and not needs_gpu" || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::warning::No needs_ffmpeg tests were collected."
            exit 0
          fi
          exit "$status"
