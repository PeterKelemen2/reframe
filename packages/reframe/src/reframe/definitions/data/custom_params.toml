# Custom encoder parameters (C-6; decision 0035 "Follow-up (core-complete review, 2026-10-16)").
#
# `VideoSettings.custom_params` reaches FFmpeg in two ways (reframe.command.video):
#
# 1. x264, x265 and SVT-AV1 get the text in their params argument (`-x265-params a=1:b=2`).
#    The library reads each key. [file_keys] lists the keys that name a file: validation
#    refuses them (`encoder.custom_param_file`), and the dry run never runs with one.
# 2. Every other encoder (VP9, NVENC, QSV, AMF, VAAPI) gets each entry as an FFmpeg option
#    (`-rc-lookahead:v:0 20`). FFmpeg reads such a name as any of its own options first
#    (`-vstats_file`, `-progress`, `-passlogfile`, `-/filter` read or write files), so only an
#    allow-list is safe: the encoder's private options (`ffmpeg -h encoder=<id>`: the build's
#    list from encoder detection, else [private_options] below) and the generic encoder options
#    of [ffmpeg].codec_options. Anything else is `encoder.custom_param_unknown`.
#
# Checked with FFmpeg n9.0.2 (BtbN and Arch builds: x264 core 165, x265 4.3, SVT-AV1 v4.2.0,
# libvpx 1.17.0) and n8.1.3 (BtbN), each key encoding with a path in a temporary folder and
# the temporary folder as working folder: testdata/README.md "Advanced encoder options (C-6,
# complete option sets)", tests/validation/test_custom_params_ffmpeg.py.
#
# Key names are compared the way the libraries read them: without leading `-`, `_` as `-`,
# in lower case, and also without a `no-` / `no` prefix (x264 and x265 read `nostats=x` as
# `stats=true`, and write a file named `true`).
#
# A key whose value is a name *or* a file name (x265 `scaling-list`, x264 `cqm`) has its names
# in [value_exceptions], compared as the library compares them ([value_match]); every other
# value is a file. Through a `no` prefix the library gets `true` / `false` (a file of that name),
# so the names never apply there (decision 0035 "Follow-up (final review, 2026-10-17)").

# --------------------------------------------------------------------------- params argument

[file_keys.libx264]
# Written (checked): the file appears.
stats = "the 2-pass statistics file (written with pass=1)"
dump-yuv = "writes the reconstructed frames to this file"
pass = "writes the 2-pass statistics (x264_2pass.log in the working folder); Reframe runs 2-pass itself"
# Read (checked: "can't open file").
cqmfile = "reads quantisation matrices from this file"
cqm = "reads quantisation matrices from this file unless the value is flat or jvt"
# Accepted by libx264; writes the compiled OpenCL kernels (no OpenCL here to see it).
opencl-clbin = "the OpenCL kernel cache file"
# Refused by libx264 today ("Error parsing option"); file options of the x264 program.
qpfile = "a file of frame types and QPs"
tcfile-in = "a timecode file"
tcfile-out = "a timecode file"
index = "an index file"
input = "an input file"
output = "an output file"

[file_keys.libx265]
# Written (checked).
csv = "writes a CSV log to this file"
analysis-save = "writes the analysis data to this file"
analysis-reuse-file = "the analysis data file (written in multi-pass analysis)"
stats = "the 2-pass statistics file (written with pass=1)"
pass = "writes the 2-pass statistics (x265_2pass.log in the working folder); Reframe runs 2-pass itself"
# Read (checked: an error about the file, or a crash on a bad one).
analysis-load = "reads analysis data from this file"
scaling-list = "reads quantisation scaling lists from this file"
lambda-file = "reads lambda tables from this file"
dhdr10-info = "reads HDR10+ metadata from this JSON file"
nalu-file = "reads SEI messages from this file (x265 crashes on a bad one)"
film-grain = "reads a film grain model from this file (x265 crashes on a bad one)"
aom-film-grain = "reads an AOM film grain table from this file"
fovea-gaze-file = "reads gaze positions from this file"
# Refused by libx265 today ("Unknown option"); file options of the x265 program.
qpfile = "a file of frame types and QPs"
zonefile = "a file of zones"
recon = "a file for the reconstructed frames"
recon-y4m-exec = "a program for the reconstructed frames"
dolby-vision-rpu = "a Dolby Vision RPU file"
scenecut-qp-config = "a scene-cut QP file"
abr-ladder = "an ABR ladder file"
input = "an input file"
output = "an output file"

[file_keys.libsvtav1]
# SVT-AV1 v4.2.0 accepts none of these ("Error parsing option"): file options of the
# SvtAv1EncApp program, refused in case a later library accepts them.
stat-file = "a statistics file"
fgs-table = "a film grain table file"
recon = "a file for the reconstructed frames"
errlog = "an error log file"
config = "a configuration file"
stats = "a 2-pass statistics file"
qpfile = "a QP file"
roi-map-file = "a region-of-interest map file"
input = "an input file"
output = "an output file"

[value_exceptions]
# Values that do not name a file, as the library sees the value (after FFmpeg's quotes and
# escapes; checked with x264 core 165 and x265 4.3, testdata/README.md C-6 "Final review").
# x265 `scaling-list`: the whole value, case-sensitive ("DEFAULT", "./default", "default "
# and "flat" are opened as files).
scaling-list = ["default", "off"]
# x264 `cqm`: a value that contains "flat" is the flat matrix, else one that contains "jvt"
# the JVT matrix ("./flat", "/x/jvt/y.cfg"); case-sensitive ("FLAT", "Flat", "JVT", "fla",
# "default" and "0" are opened as files).
cqm = ["flat", "jvt"]

[value_match]
# How the library compares a value with [value_exceptions]: "whole" (strcmp, the default) or
# "contains" (strstr: x264's `cqm`).
cqm = "contains"

# --------------------------------------------------------------------------- own options

[ffmpeg]
# AVCodecContext options with the encoding and video flags (`ffmpeg -h full`, "AVCodecContext
# AVOptions", flags E..V; the same in n9.0.2 and n8.1.3). `aspect`, `b` and `profile` are also
# FFmpeg's own options of the same meaning (they set the codec option).
