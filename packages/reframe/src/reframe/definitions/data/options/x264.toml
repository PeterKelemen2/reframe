# x264 advanced options (C-6: 03 §Advanced's coverage list, completed in M9).
#
# Every option goes into `-x264-params` (x26x_param). The per-preset defaults are what x264
# itself writes into the stream (the "x264 - core … options:" SEI) for `-preset <p>` with no
# tune, FFmpeg n9.0.2 / x264 core 165; `tunes` lists the tunes that change the value.
# tests/definitions/test_tools.py encodes every preset again and compares.

[[set.x264]]
key = "bframes"
label = "B-frames"
category = "Frame types / GOP"
type = "int"
min = 0
max = 16
step = 1
unit = "frames"
help = "Maximum number of consecutive B-frames. More B-frames compress better; 3 is typical, 5–8 helps animation. Little speed cost."
mapping = { kind = "x26x_param", name = "bframes" }
default = { kind = "preset", tunes = ["animation", "zerolatency"], values = { ultrafast = 0, superfast = 3, veryfast = 3, faster = 3, fast = 3, medium = 3, slow = 3, slower = 3, veryslow = 8, placebo = 16 } }

[[set.x264]]
key = "b-adapt"
label = "Adaptive B-frames"
category = "Frame types / GOP"
type = "enum"
choices = [
    { value = "0", label = "Off", help = "Always use the maximum number of B-frames." },
    { value = "1", label = "Fast" },
    { value = "2", label = "Optimal", help = "Slower, better with many B-frames." },
]
help = "How x264 decides where to place B-frames."
mapping = { kind = "x26x_param", name = "b-adapt" }
default = { kind = "preset", tunes = ["animation", "zerolatency"], values = { superfast = "1", veryfast = "1", faster = "1", fast = "1", medium = "1", slow = "1", slower = "2", veryslow = "2", placebo = "2" } }

[[set.x264]]
key = "b-pyramid"
label = "B-pyramid"
category = "Frame types / GOP"
type = "enum"
choices = [
    { value = "none", label = "Off" },
    { value = "strict", label = "Strict", help = "Blu-ray compatible." },
    { value = "normal", label = "Normal" },
]
help = "Lets B-frames be used as references. Improves compression; Strict is required for Blu-ray."
mapping = { kind = "x26x_param", name = "b-pyramid" }
default = { kind = "preset", tunes = ["animation", "zerolatency"], values = { superfast = "normal", veryfast = "normal", faster = "normal", fast = "normal", medium = "normal", slow = "normal", slower = "normal", veryslow = "normal", placebo = "normal" } }

[[set.x264]]
key = "ref"
label = "Reference frames"
category = "Frame types / GOP"
type = "int"
min = 1
max = 16
step = 1
unit = "frames"
help = "How many earlier frames a frame can reference. More helps animation and static scenes, costs speed; old players limit it (level)."
mapping = { kind = "x26x_param", name = "ref" }
default = { kind = "preset", tunes = ["animation"], values = { ultrafast = 1, superfast = 1, veryfast = 1, faster = 2, fast = 2, medium = 3, slow = 5, slower = 8, veryslow = 16, placebo = 16 } }

[[set.x264]]
key = "keyint"
label = "Keyframe interval"
category = "Frame types / GOP"
type = "int"
min = 1
max = 1000
step = 1
unit = "frames"
help = "Maximum distance between keyframes (seek points). 250 is about 10 s at 25 fps; smaller values help seeking and cost size."
mapping = { kind = "x26x_param", name = "keyint" }
default = { kind = "fixed", value = 250 }

[[set.x264]]
key = "min-keyint"
label = "Minimum keyframe interval"
category = "Frame types / GOP"
type = "int"
min = 1
max = 1000
step = 1
unit = "frames"
help = "Minimum distance between keyframes at scene cuts. Auto is a tenth of the keyframe interval, at most the frame rate."
mapping = { kind = "x26x_param", name = "min-keyint" }
default = { kind = "encoder", note = "auto: keyint / 10, at most the frame rate" }

[[set.x264]]
key = "scenecut"
label = "Scene cut threshold"
category = "Frame types / GOP"
type = "int"
min = 0
max = 100
step = 1
help = "How eagerly a keyframe is placed at a scene change. 0 turns scene-cut detection off."
mapping = { kind = "x26x_param", name = "scenecut" }
default = { kind = "preset", values = { ultrafast = 0, superfast = 40, veryfast = 40, faster = 40, fast = 40, medium = 40, slow = 40, slower = 40, veryslow = 40, placebo = 40 } }

[[set.x264]]
key = "rc-lookahead"
label = "Rate-control look-ahead"
category = "Rate control"
type = "int"
min = 0
max = 250
step = 1
unit = "frames"
help = "Frames analysed ahead for macroblock-tree and frame types. More is better and uses more memory; 40–60 is typical."
mapping = { kind = "x26x_param", name = "rc-lookahead" }
default = { kind = "preset", tunes = ["zerolatency"], values = { veryfast = 10, faster = 20, fast = 30, medium = 40, slow = 50, slower = 60, veryslow = 60, placebo = 60 } }

[[set.x264]]
key = "weightp"
label = "Weighted P-frames"
category = "Frame types / GOP"
type = "enum"
choices = [
    { value = "0", label = "Off" },
    { value = "1", label = "Simple" },
    { value = "2", label = "Smart", help = "Best for fades." },
]
help = "Weighted prediction for P-frames: improves fades. Off for some old hardware decoders."
mapping = { kind = "x26x_param", name = "weightp" }
default = { kind = "preset", tunes = ["fastdecode"], values = { ultrafast = "0", superfast = "1", veryfast = "1", faster = "1", fast = "1", medium = "2", slow = "2", slower = "2", veryslow = "2", placebo = "2" } }

[[set.x264]]
key = "aq-mode"
label = "Adaptive quantisation"
category = "Rate control"
type = "enum"
choices = [
    { value = "0", label = "Off" },
    { value = "1", label = "Variance" },
    { value = "2", label = "Auto-variance" },
    { value = "3", label = "Auto-variance, dark scenes", help = "Spends more bits on dark areas." },
]
help = "Moves bits from detailed areas to flat areas, where blocking would be visible."
mapping = { kind = "x26x_param", name = "aq-mode" }
default = { kind = "preset", tunes = ["psnr", "ssim"], values = { ultrafast = "0", superfast = "1", veryfast = "1", faster = "1", fast = "1", medium = "1", slow = "1", slower = "1", veryslow = "1", placebo = "1" } }

[[set.x264]]
key = "aq-strength"
label = "AQ strength"
category = "Rate control"
type = "float"
min = 0
max = 3
step = 0.05
help = "How strongly adaptive quantisation acts. 0.5–1.3 is typical; lower keeps grain, higher fights blocking in flat areas."
mapping = { kind = "x26x_param", name = "aq-strength" }
requires = [{ field = "option:aq-mode", op = "ne", value = "0" }]
default = { kind = "preset", tunes = ["animation", "grain", "psnr", "ssim", "stillimage"], values = { superfast = 1.0, veryfast = 1.0, faster = 1.0, fast = 1.0, medium = 1.0, slow = 1.0, slower = 1.0, veryslow = 1.0, placebo = 1.0 } }

[[set.x264]]
key = "mbtree"
label = "Macroblock tree"
category = "Rate control"
type = "bool"
help = "Gives more quality to parts of the picture that later frames reference. Better compression; can flatten grain."
mapping = { kind = "x26x_param", name = "mbtree" }
default = { kind = "preset", tunes = ["zerolatency"], values = { ultrafast = false, superfast = false, veryfast = true, faster = true, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = true } }

[[set.x264]]
key = "qcomp"
label = "Quantiser curve compression"
category = "Rate control"
type = "float"
min = 0
max = 1
step = 0.05
help = "0 is constant bitrate, 1 constant quantiser. Higher values keep more detail in complex scenes (grain tune: 0.8)."
mapping = { kind = "x26x_param", name = "qcomp" }
default = { kind = "fixed", value = 0.6 }

[[set.x264]]
key = "vbv-maxrate"
label = "VBV maximum rate"
category = "Rate control"
type = "int"
min = 0
max = 300000
step = 1
unit = "kb/s"
help = "Peak bitrate for players with a bitrate limit (set together with the VBV buffer). 0 = no limit."
mapping = { kind = "x26x_param", name = "vbv-maxrate" }
default = { kind = "fixed", value = 0 }

[[set.x264]]
key = "vbv-bufsize"
label = "VBV buffer size"
category = "Rate control"
type = "int"
min = 0
max = 300000
step = 1
unit = "kb"
help = "Decoder buffer for the VBV maximum rate. 0 = no limit."
mapping = { kind = "x26x_param", name = "vbv-bufsize" }
default = { kind = "fixed", value = 0 }

[[set.x264]]
key = "psy-rd"
label = "Psy-RD strength"
category = "Psycho-visual"
type = "float"
min = 0
max = 2
step = 0.05
help = "Keeps detail and texture instead of a smooth, blurry picture. 1.0 is the default; 0.4 for animation."
mapping = { kind = "x26x_param", name = "psy-rd", part = 0 }
requires = [{ field = "option:psy", op = "ne", value = false }]
default = { kind = "preset", tunes = ["animation", "psnr", "ssim", "stillimage"], values = { ultrafast = 1.0, superfast = 1.0, veryfast = 1.0, faster = 1.0, fast = 1.0, medium = 1.0, slow = 1.0, slower = 1.0, veryslow = 1.0, placebo = 1.0 } }

[[set.x264]]
key = "psy-trellis"
label = "Psy-trellis strength"
category = "Psycho-visual"
type = "float"
min = 0
max = 1
step = 0.05
help = "Keeps grain and fine noise (needs trellis). 0.15 for film, 0.25 for grain."
mapping = { kind = "x26x_param", name = "psy-rd", part = 1 }
requires = [{ field = "option:psy", op = "ne", value = false }]
default = { kind = "preset", tunes = ["film", "grain", "psnr", "ssim", "stillimage"], values = { ultrafast = 0.0, superfast = 0.0, veryfast = 0.0, faster = 0.0, fast = 0.0, medium = 0.0, slow = 0.0, slower = 0.0, veryslow = 0.0, placebo = 0.0 } }

[[set.x264]]
key = "deblock-alpha"
label = "Deblock strength"
category = "Loop filters"
type = "int"
min = -6
max = 6
step = 1
help = "In-loop deblocking strength. Negative keeps more detail (film -1, grain -2), positive gives a smoother picture (animation +1)."
mapping = { kind = "x26x_param", name = "deblock", part = 0 }
default = { kind = "preset", tunes = ["animation", "film", "grain", "stillimage"], values = { ultrafast = 0, superfast = 0, veryfast = 0, faster = 0, fast = 0, medium = 0, slow = 0, slower = 0, veryslow = 0, placebo = 0 } }

[[set.x264]]
key = "deblock-beta"
label = "Deblock threshold"
category = "Loop filters"
type = "int"
min = -6
max = 6
step = 1
help = "Which edges deblocking treats as block edges. Usually set to the same value as the strength."
mapping = { kind = "x26x_param", name = "deblock", part = 1 }
default = { kind = "preset", tunes = ["animation", "film", "grain", "stillimage"], values = { ultrafast = 0, superfast = 0, veryfast = 0, faster = 0, fast = 0, medium = 0, slow = 0, slower = 0, veryslow = 0, placebo = 0 } }

[[set.x264]]
key = "me"
label = "Motion estimation"
category = "Motion / analysis"
type = "enum"
choices = [
    { value = "dia", label = "Diamond", help = "Fastest." },
    { value = "hex", label = "Hexagon" },
    { value = "umh", label = "Uneven multi-hexagon", help = "Good quality, moderate cost." },
    { value = "esa", label = "Exhaustive", help = "Very slow." },
    { value = "tesa", label = "Transformed exhaustive", help = "Slowest." },
]
help = "Motion search method."
mapping = { kind = "x26x_param", name = "me" }
default = { kind = "preset", values = { ultrafast = "dia", superfast = "dia", veryfast = "hex", faster = "hex", fast = "hex", medium = "hex", slow = "hex", slower = "umh", veryslow = "umh", placebo = "tesa" } }

[[set.x264]]
key = "subme"
label = "Subpixel refinement"
category = "Motion / analysis"
type = "int"
min = 0
max = 11
step = 1
# x264 core 165: subme 10 and 11 need trellis=2; with a lower trellis x264 writes subme=9
# into the stream without a message (also for the veryslow and placebo presets with
# trellis 0 or 1). A rule across two options: validation (C-8) checks it.
help = "Quality of the motion and mode decisions. 7–9 is a good balance; 10 and 11 are slow and need Trellis set to Always (with a lower trellis x264 uses 9)."
mapping = { kind = "x26x_param", name = "subme" }
default = { kind = "preset", values = { ultrafast = 0, superfast = 1, veryfast = 2, faster = 4, fast = 6, medium = 7, slow = 8, slower = 9, veryslow = 10, placebo = 11 } }

[[set.x264]]
key = "merange"
label = "Motion search range"
category = "Motion / analysis"
type = "int"
min = 4
max = 64
step = 1
unit = "pixels"
help = "How far the motion search looks. 16 is enough for most video; 24–32 for fast motion at high resolution."
mapping = { kind = "x26x_param", name = "merange" }
default = { kind = "preset", values = { ultrafast = 16, superfast = 16, veryfast = 16, faster = 16, fast = 16, medium = 16, slow = 16, slower = 16, veryslow = 24, placebo = 24 } }

[[set.x264]]
key = "trellis"
label = "Trellis quantisation"
category = "Motion / analysis"
type = "enum"
choices = [
    { value = "0", label = "Off" },
    { value = "1", label = "Final encode only" },
    { value = "2", label = "Always", help = "Slower, a little smaller." },
]
help = "Rate-distortion optimised quantisation. Subpixel refinement 10 and 11 need Always: with a lower setting x264 uses subpixel refinement 9."
mapping = { kind = "x26x_param", name = "trellis" }
default = { kind = "preset", values = { ultrafast = "0", superfast = "0", veryfast = "0", faster = "1", fast = "1", medium = "1", slow = "2", slower = "2", veryslow = "2", placebo = "2" } }

[[set.x264]]
key = "direct"
label = "Direct prediction"
category = "Motion / analysis"
type = "enum"
choices = [
    { value = "none", label = "None" },
    { value = "spatial", label = "Spatial" },
    { value = "temporal", label = "Temporal" },
    { value = "auto", label = "Auto" },
]
help = "How motion vectors of B-frames are predicted."
mapping = { kind = "x26x_param", name = "direct" }
default = { kind = "preset", tunes = ["animation", "zerolatency"], values = { superfast = "spatial", veryfast = "spatial", faster = "spatial", fast = "spatial", medium = "spatial", slow = "auto", slower = "auto", veryslow = "auto", placebo = "auto" } }

# --------------------------------------------------------------------------- M9 additions
#
# Per-preset tables as above (the stream's settings SEI for every preset and every tune).
# The colour options are not in the SEI: ffprobe reads them from the stream's VUI. FFmpeg's
# libx264 wrapper overrides x264's own `range` with the input's range, so it is not offered
# (testdata/README.md "Advanced encoder options (C-6, complete option sets)").

[[set.x264]]
key = "open-gop"
label = "Open GOP"
category = "Frame types / GOP"
type = "bool"
help = "Lets B-frames before a keyframe reference the GOP before it: slightly better compression, but cutting and some old players (Blu-ray) need closed GOPs."
mapping = { kind = "x26x_param", name = "open-gop" }
default = { kind = "preset", tunes = ["animation", "zerolatency"], values = { superfast = false, veryfast = false, faster = false, fast = false, medium = false, slow = false, slower = false, veryslow = false, placebo = false } }

[[set.x264]]
key = "b-bias"
label = "B-frame bias"
category = "Frame types / GOP"
type = "int"
min = -90
max = 100
step = 1
help = "Makes B-frames more (positive) or less (negative) likely to be chosen. 0 is right for almost everything; x264 clamps the value to -90 … 100."
mapping = { kind = "x26x_param", name = "b-bias" }
default = { kind = "preset", tunes = ["animation", "zerolatency"], values = { superfast = 0, veryfast = 0, faster = 0, fast = 0, medium = 0, slow = 0, slower = 0, veryslow = 0, placebo = 0 } }

[[set.x264]]
key = "weightb"
label = "Weighted B-frames"
category = "Frame types / GOP"
type = "bool"
help = "Weighted prediction for B-frames: better fades and cross-fades at a small speed cost. Off for some old hardware decoders."
mapping = { kind = "x26x_param", name = "weightb" }
default = { kind = "preset", tunes = ["animation", "fastdecode", "zerolatency"], values = { superfast = true, veryfast = true, faster = true, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = true } }

[[set.x264]]
key = "bluray-compat"
label = "Blu-ray compatibility"
category = "Frame types / GOP"
type = "bool"
# x264 core 165: with bluray-compat=1 the stream says bframes=3, weightp=1, b_pyramid=1
# (strict) for bframes=5:weightp=2:b-pyramid=normal, without a message. Validation (C-8)
# warns about values the job sets above these limits.
help = "Follows the Blu-ray limits: at most 3 B-frames, simple weighted P-frames and a strict B-pyramid (x264 lowers higher values without a message). Use with the VBV settings and a Blu-ray level."
mapping = { kind = "x26x_param", name = "bluray-compat" }
default = { kind = "fixed", value = false }

[[set.x264]]
key = "ipratio"
label = "I/P quantiser ratio"
category = "Rate control"
type = "float"
min = 1
max = 2
step = 0.05
help = "How much better keyframes are quantised than P-frames. 1.4 is the default; the grain tune uses 1.1 to keep keyframes from standing out."
mapping = { kind = "x26x_param", name = "ipratio" }
default = { kind = "preset", tunes = ["grain"], values = { ultrafast = 1.4, superfast = 1.4, veryfast = 1.4, faster = 1.4, fast = 1.4, medium = 1.4, slow = 1.4, slower = 1.4, veryslow = 1.4, placebo = 1.4 } }

[[set.x264]]
key = "pbratio"
label = "P/B quantiser ratio"
category = "Rate control"
type = "float"
min = 1
max = 2
step = 0.05
# The stream's settings show pb_ratio only with macroblock tree off.
help = "How much worse B-frames are quantised than P-frames (1.3 by default; the grain tune uses 1.1). With the macroblock tree on, x264 decides this itself."
mapping = { kind = "x26x_param", name = "pbratio" }
default = { kind = "fixed", value = 1.3 }

[[set.x264]]
key = "qpmin"
label = "Minimum quantiser"
category = "Rate control"
type = "int"
min = 0
max = 69
step = 1
help = "The lowest QP x264 may use. Raising it wastes fewer bits on very clean scenes; 0 (no limit) is the default."
mapping = { kind = "x26x_param", name = "qpmin" }
default = { kind = "fixed", value = 0 }

[[set.x264]]
key = "qpmax"
label = "Maximum quantiser"
category = "Rate control"
type = "int"
# x264 core 165: 8-bit clamps qpmax to 69 (qpmax=81 → 69 in the stream); 10-bit allows 81.
min = 0
max = 69
step = 1
help = "The highest QP x264 may use. A lower limit avoids very blocky frames in average-bitrate encodes; by default there is no limit."
mapping = { kind = "x26x_param", name = "qpmax" }
default = { kind = "encoder", note = "no limit (69 for 8-bit, 81 for 10-bit)" }

[[set.x264]]
key = "nal-hrd"
label = "HRD signalling"
category = "Rate control"
type = "enum"
choices = [
    { value = "none", label = "Off" },
    { value = "vbr", label = "VBR", help = "Blu-ray and broadcast VBR." },
    { value = "cbr", label = "CBR", help = "Constant bitrate with filler; for broadcast." },
]
# x264 core 165: without both VBV values x264 logs "NAL HRD parameters require VBV
# parameters" and leaves it out.
help = "Writes hypothetical reference decoder information (needed for Blu-ray). Needs the VBV maximum rate and buffer size; x264 ignores it without them."
mapping = { kind = "x26x_param", name = "nal-hrd" }
requires = [{ field = "option:vbv-maxrate", op = "ne", value = 0 }, { field = "option:vbv-bufsize", op = "ne", value = 0 }]
default = { kind = "fixed", value = "none" }

[[set.x264]]
key = "partitions"
label = "Partitions"
category = "Motion / analysis"
type = "enum"
choices = [
    { value = "none", label = "None", help = "Fastest: whole macroblocks only." },
    { value = "i8x8,i4x4", label = "Intra only (i8x8, i4x4)" },
    { value = "p8x8,b8x8,i8x8,i4x4", label = "Default (p8x8, b8x8, i8x8, i4x4)" },
    { value = "all", label = "All (adds p4x4)", help = "Slowest; p4x4 rarely helps above SD." },
]
help = "Which macroblock partitions the analysis tries. More partitions follow fine motion better and cost speed. i8x8 needs the 8×8 transform."
mapping = { kind = "x26x_param", name = "partitions" }
default = { kind = "preset", values = { ultrafast = "none", superfast = "i8x8,i4x4", veryfast = "p8x8,b8x8,i8x8,i4x4", faster = "p8x8,b8x8,i8x8,i4x4", fast = "p8x8,b8x8,i8x8,i4x4", medium = "p8x8,b8x8,i8x8,i4x4", slow = "p8x8,b8x8,i8x8,i4x4", slower = "all", veryslow = "all", placebo = "all" } }

[[set.x264]]
key = "8x8dct"
label = "8×8 transform"
category = "Motion / analysis"
type = "bool"
help = "Adaptive 8×8 transform (High profile). Better compression of detail at almost no cost; off only for Main or Baseline profile players."
mapping = { kind = "x26x_param", name = "8x8dct" }
default = { kind = "preset", values = { ultrafast = false, superfast = true, veryfast = true, faster = true, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = true } }

[[set.x264]]
key = "mixed-refs"
label = "Mixed references"
category = "Motion / analysis"
type = "bool"
help = "Lets each 8×8 partition choose its own reference frame. Better quality with several reference frames, small speed cost."
mapping = { kind = "x26x_param", name = "mixed-refs" }
default = { kind = "preset", values = { ultrafast = false, superfast = false, veryfast = false, faster = false, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = true } }

[[set.x264]]
key = "fast-pskip"
label = "Fast P-skip"
category = "Motion / analysis"
type = "bool"
help = "Detects skipped blocks in P-frames early. Faster; off (placebo) can avoid blocking in dark, flat areas."
mapping = { kind = "x26x_param", name = "fast-pskip" }
default = { kind = "preset", values = { ultrafast = true, superfast = true, veryfast = true, faster = true, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = false } }

[[set.x264]]
key = "chroma-me"
label = "Chroma motion estimation"
category = "Motion / analysis"
type = "bool"
help = "Uses the colour planes in the motion search. Slightly better colour; off is a little faster."
mapping = { kind = "x26x_param", name = "chroma-me" }
default = { kind = "fixed", value = true }

[[set.x264]]
key = "dct-decimate"
label = "DCT decimation"
category = "Motion / analysis"
type = "bool"
help = "Drops blocks that are nearly empty. Saves bits; off (the grain tune) keeps more fine grain and noise."
mapping = { kind = "x26x_param", name = "dct-decimate" }
default = { kind = "preset", tunes = ["grain"], values = { ultrafast = true, superfast = true, veryfast = true, faster = true, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = true } }

[[set.x264]]
key = "cabac"
label = "CABAC"
category = "Motion / analysis"
type = "bool"
help = "Arithmetic entropy coding: about 10–15 % smaller files. Off (CAVLC) only for Baseline profile players or the fast decode tune."
mapping = { kind = "x26x_param", name = "cabac" }
default = { kind = "preset", tunes = ["fastdecode"], values = { ultrafast = false, superfast = true, veryfast = true, faster = true, fast = true, medium = true, slow = true, slower = true, veryslow = true, placebo = true } }

[[set.x264]]
key = "psy"
label = "Psycho-visual optimisations"
category = "Psycho-visual"
type = "bool"
help = "Master switch for psy-RD and psy-trellis. Off (the PSNR and SSIM tunes) gives a softer picture that measures better."
mapping = { kind = "x26x_param", name = "psy" }
