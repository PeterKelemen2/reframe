[[set.qsv_h264]]
key = "look_ahead_downsampling"
label = "Look-ahead downsampling"
category = "Rate control"
type = "enum"
choices = [
    { value = "auto", label = "Automatic" },
    { value = "off", label = "Off", help = "Best, slowest." },
    { value = "2x", label = "2×" },
    { value = "4x", label = "4×", help = "Fastest. Some GPUs use 2× instead (an Intel UHD 620 does)." },
]
help = "Scales the frames down for the look-ahead analysis."
mapping = { kind = "private_opt", name = "look_ahead_downsampling" }
requires = [{ field = "option:look_ahead", op = "eq", value = true }]
default = { kind = "encoder", note = "automatic" }

[[set.qsv_h264]]
key = "cavlc"
label = "CAVLC"
category = "Motion / analysis"
type = "bool"
help = "CAVLC entropy coding instead of CABAC: larger files, easier to decode."
mapping = { kind = "private_opt", name = "cavlc" }
default = { kind = "fixed", value = false }

[[set.qsv_hevc]]
key = "gpb"
label = "Generalised P/B frames"
category = "Frame types / GOP"
type = "bool"
help = "Encodes P-frames as generalised B-frames (better compression); off writes regular P-frames for players that need them."
mapping = { kind = "private_opt", name = "gpb" }
default = { kind = "fixed", value = true }

[[set.qsv_hevc]]
key = "transform_skip"
label = "Transform skip"
category = "Motion / analysis"
type = "bool"
help = "Allows blocks without a transform: helps text and screen content. Some GPUs ignore it (an Intel UHD 620 does)."
mapping = { kind = "private_opt", name = "transform_skip" }
default = { kind = "encoder", note = "the driver decides" }

[[set.qsv_tiles]]
key = "tile_cols"
label = "Tile columns"
category = "Performance"
type = "int"
min = 0
max = 64
step = 1
help = "Number of tile columns (0 = the driver decides). Not every GPU has tiles: an Intel UHD 620 refuses more than one."
mapping = { kind = "private_opt", name = "tile_cols" }
default = { kind = "fixed", value = 0 }

[[set.qsv_tiles]]
key = "tile_rows"
label = "Tile rows"
category = "Performance"
type = "int"
min = 0
max = 64
step = 1
help = "Number of tile rows (0 = the driver decides). Not every GPU has tiles: an Intel UHD 620 refuses more than one."
mapping = { kind = "private_opt", name = "tile_rows" }
default = { kind = "fixed", value = 0 }

[[set.amf]]
key = "enforce_hrd"
label = "Enforce HRD"
category = "Rate control"
type = "bool"
help = "Keeps the stream within the hypothetical reference decoder's buffer (for players with strict bitrate limits)."
mapping = { kind = "private_opt", name = "enforce_hrd" }
default = { kind = "encoder", note = "the driver decides" }

[[set.amf]]
key = "filler_data"
label = "Filler data"
category = "Rate control"
type = "bool"
help = "Pads the stream up to the target bitrate (constant bitrate for broadcast). Only with average bitrate."
mapping = { kind = "private_opt", name = "filler_data" }
requires = [{ field = "rate_control", value = "bitrate" }]
default = { kind = "encoder", note = "the driver decides" }

[[set.amf]]
key = "preencode"
label = "Pre-encode"
category = "Rate control"
type = "bool"
