[[set.vaapi]]
key = "g"
label = "Keyframe interval"
category = "Frame types / GOP"
type = "int"
min = 1
max = 1000
step = 1
unit = "frames"
help = "Maximum distance between keyframes (seek points)."
mapping = { kind = "ffmpeg_arg", arg = "-g" }
default = { kind = "encoder", note = "the encoder decides" }

[[set.vaapi]]
key = "compression_level"
label = "Quality level"
category = "Performance"
type = "int"
min = 0
max = 7
step = 1
help = "Driver quality/speed level (VAAPI has no presets). Its meaning depends on the driver; usually lower is slower and better. An Intel UHD 620 takes only 1, 4 and 7 for H.265."
mapping = { kind = "ffmpeg_arg", arg = "-compression_level" }
default = { kind = "encoder", note = "the driver decides" }

[[set.vaapi_h264]]
key = "coder"
label = "Entropy coder"
category = "Motion / analysis"
type = "enum"
choices = [
    { value = "cabac", label = "CABAC", help = "Smaller files." },
    { value = "cavlc", label = "CAVLC", help = "Easier to decode." },
]
help = "H.264 entropy coding."
mapping = { kind = "private_opt", name = "coder" }
default = { kind = "fixed", value = "cabac" }

[[set.nvenc]]
key = "no-scenecut"
label = "No scene-cut keyframes"
category = "Frame types / GOP"
type = "bool"
help = "Turns off the keyframes the look-ahead places at scene cuts (for a fixed GOP). Only with look-ahead."
mapping = { kind = "private_opt", name = "no-scenecut" }
requires = [{ field = "option:rc-lookahead", op = "ne", value = 0 }]
default = { kind = "fixed", value = false }

[[set.nvenc]]
key = "b_adapt"
label = "Adaptive B-frames"
category = "Frame types / GOP"
type = "bool"
help = "Lets the look-ahead choose where B-frames go. Only with look-ahead."
mapping = { kind = "private_opt", name = "b_adapt" }
requires = [{ field = "option:rc-lookahead", op = "ne", value = 0 }]
default = { kind = "fixed", value = true }

[[set.nvenc]]
key = "weighted_pred"
label = "Weighted prediction"
category = "Frame types / GOP"
type = "bool"
help = "Weighted prediction: better fades. NVENC refuses it together with B-frames: only with B-frames set to 0."
requires = [{ field = "option:bf", op = "eq", value = 0 }]
mapping = { kind = "private_opt", name = "weighted_pred" }
default = { kind = "fixed", value = false }

[[set.nvenc]]
key = "nonref_p"
label = "Non-reference P-frames"
category = "Frame types / GOP"
type = "bool"
help = "Lets the encoder insert P-frames that nothing references. Saves bits on static content."
mapping = { kind = "private_opt", name = "nonref_p" }
default = { kind = "fixed", value = false }

[[set.nvenc]]
key = "strict_gop"
label = "Strict GOP"
category = "Rate control"
type = "bool"
help = "Keeps the bitrate within each GOP close to the target (less fluctuation, lower quality in hard scenes)."
mapping = { kind = "private_opt", name = "strict_gop" }
default = { kind = "fixed", value = false }

[[set.nvenc]]
key = "lookahead_level"
label = "Look-ahead level"
category = "Rate control"
type = "enum"
choices = [
    { value = "auto", label = "Automatic" },
    { value = "0", label = "0" },
    { value = "1", label = "1" },
    { value = "2", label = "2" },
    { value = "3", label = "3", help = "Best, slowest." },
]
help = "How much analysis the look-ahead does (needs a recent GPU and driver; a GeForce 10 series (Pascal) GPU takes only Automatic). Only with look-ahead."
mapping = { kind = "private_opt", name = "lookahead_level" }
requires = [{ field = "option:rc-lookahead", op = "ne", value = 0 }]
default = { kind = "encoder", note = "automatic" }

[[set.nvenc]]
key = "tf_level"
label = "Temporal filter"
category = "Psycho-visual"
type = "enum"
choices = [
    { value = "0", label = "Off" },
    { value = "4", label = "On (level 4)" },
]
help = "Temporal noise filtering of the source before encoding (needs a recent GPU and driver, and B-frames; a GeForce 10 series (Pascal) GPU refuses it)."
mapping = { kind = "private_opt", name = "tf_level" }
default = { kind = "encoder", note = "the driver decides" }

[[set.nvenc]]
key = "qp_cb_offset"
label = "Cb QP offset"
category = "Rate control"
type = "int"
min = -12
max = 12
step = 1
help = "Quantiser offset of the blue-difference plane. Negative values spend more bits on colour."
mapping = { kind = "private_opt", name = "qp_cb_offset" }
default = { kind = "fixed", value = 0 }

[[set.nvenc]]
key = "qp_cr_offset"
label = "Cr QP offset"
category = "Rate control"
type = "int"
min = -12
max = 12
step = 1
help = "Quantiser offset of the red-difference plane."
mapping = { kind = "private_opt", name = "qp_cr_offset" }
default = { kind = "fixed", value = 0 }

[[set.nvenc]]
key = "gpu"
label = "GPU"
category = "Performance"
type = "int"
min = 0
max = 15
step = 1
help = "Which NVIDIA GPU encodes (0 = the first). Not set, the driver picks any free GPU."
mapping = { kind = "private_opt", name = "gpu" }
default = { kind = "encoder", note = "any GPU" }

[[set.nvenc_qp51]]
