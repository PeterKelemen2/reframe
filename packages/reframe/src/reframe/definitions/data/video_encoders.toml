# Video encoders. Table key = FFmpeg encoder name.
#
# Hardware setup: the VAAPI and AMF setup is checked by real encodes on an AMD GPU, the QSV
# setup on an Intel UHD 620 under Windows (testdata/README.md); NVENC is NOT verified on its
# hardware. NVENC, AMF and QSV take software frames: a QSV upload with a fixed frame pool
# (`hwupload=extra_hw_frames=N`) fails on that Intel driver (decision 0095).
# Placeholders: {vaapi_device} (default /dev/dri/renderD128), {sw_pix_fmt} (pix_fmts below).
#
# Fallback chains: the same codec on the other hardware families, then software.
#
# Loader rules (reframe/definitions/loader.py): `extends = "<base>"` merges a [base.<name>]
# table under the encoder's keys; `option_sets = [...]` prepends the options of
# options/*.toml.
#
# Sources (every value is checked against FFmpeg, see testdata/README.md and
# tests/definitions/test_tools.py):
# - Presets, tunes, profiles, levels and private options: `ffmpeg -h encoder=<id>`
#   (testing/reframe_testing/fake_data/help_encoder/) and, for x264 / x265, the lists the
#   libraries print for a bad value ("Possible presets: …").
# - Rate control: HandBrake 1.11.2 libhb/common.c `hb_video_quality_get_limits` (range,
#   step, direction), libhb/encavcodec.c (NVENC `-rc vbr -cq`, AMF `-rc cqp -qp_i/-qp_p/-qp_b`
#   with HandBrake's P/B offsets, QSV ICQ `-global_quality`), checked with real encodes on
#   AMF and VAAPI (AMD RX 7600); NVENC and QSV are not checked on hardware.
# - Default quality values: HandBrake 1.11.2 preset/preset_builtin.json (1080p presets);
#   recommended bands: HandBrake documentation, "Adjusting quality" (x264, x265, SVT-AV1).
# - Quality conversion (`scale`): points (value, x264 RF equivalent). x265 = x264 and the
#   SVT-AV1 points follow HandBrake's docs and presets (same bands, same preset values at the
#   same resolution); NVENC / QSV / AMF H.265 follow HandBrake's hardware presets (NVENC 27 /
#   30, QSV and VCN 25 / 28 against x264 22 / 24 at 1080p / 2160p). Encoders without a
#   HandBrake preset (NVENC H.264 and AV1, AMF H.264, VAAPI) are ASSUMED to match their
#   nearest relative; the result is approximate by design.

[base.x26x.presets]
default = "medium"
mapping = { kind = "private_opt", name = "preset" }
help = "Speed against compression: a slower preset makes a smaller file at the same quality. The quality value stays comparable between presets."
choices = [
    { value = "ultrafast", label = "Ultrafast" },
    { value = "superfast", label = "Superfast" },
    { value = "veryfast", label = "Very fast" },
    { value = "faster", label = "Faster" },
    { value = "fast", label = "Fast" },
    { value = "medium", label = "Medium" },
    { value = "slow", label = "Slow" },
    { value = "slower", label = "Slower" },
    { value = "veryslow", label = "Very slow" },
    { value = "placebo", label = "Placebo", help = "Much slower than Very slow for almost no gain." },
]

[base.x26x.rate_control.quality]
kind = "crf"
label = "RF"
min = 0
max = 51
step = 0.1
default = 22
args = ["-crf", "{value}"]
scale = [[0, 0], [51, 51]]
help = "Constant rate factor: the same visual quality through the whole video; the file size follows the content. Lower is better quality and a bigger file; 0 is lossless (8-bit)."
recommended = [
    { max_height = 576, low = 18, high = 22 },
    { max_height = 720, low = 19, high = 23 },
    { max_height = 1080, low = 20, high = 24 },
    { max_height = 2160, low = 22, high = 28 },
]

[base.x26x.rate_control.bitrate]
args = ["-b:v", "{kbps}k"]
help = "Average bitrate: a predictable file size. Use 2-pass for the best quality at that size."

[base.nvenc]
help = "NVIDIA's hardware encoder (GeForce, RTX, Quadro). Very fast; at the same quality the files are larger than with x264 / x265."

[base.nvenc.presets]
default = "p4"
mapping = { kind = "private_opt", name = "preset" }
help = "p1 is the fastest, p7 the slowest with the best compression."
choices = [
    { value = "p1", label = "P1 (fastest)" },
    { value = "p2", label = "P2 (faster)" },
    { value = "p3", label = "P3 (fast)" },
    { value = "p4", label = "P4 (medium)" },
    { value = "p5", label = "P5 (slow)" },
    { value = "p6", label = "P6 (slower)" },
    { value = "p7", label = "P7 (slowest)" },
]

[base.nvenc.tunes]
default = "hq"
mapping = { kind = "private_opt", name = "tune" }
help = "Tuning info. High quality is right for file encodes; the low-latency tunes are for streaming."
choices = [
    { value = "hq", label = "High quality" },
    { value = "ll", label = "Low latency" },
    { value = "ull", label = "Ultra low latency" },
    { value = "lossless", label = "Lossless" },
]

[base.nvenc.rate_control.quality]
kind = "cq"
label = "CQ"
min = 1
max = 51
step = 0.1
default = 27
# HandBrake 1.11.2 encavcodec.c: rc=vbr, cq, init_qpP = q, init_qpB = q+2, init_qpI = q-2.
args = ["-rc", "vbr", "-cq", "{value}", "-b:v", "0", "-init_qpI", "{qp_i}", "-init_qpP", "{qp_p}", "-init_qpB", "{qp_b}"]
derived = { qp_i = { offset = -2, min = 0, integer = true }, qp_p = { integer = true }, qp_b = { offset = 2, max = 51, integer = true } }
scale = [[1, 1], [27, 22], [30, 24], [51, 51]]
help = "Constant quality in VBR mode (target quality, no bitrate limit). Lower is better quality and a bigger file."

[base.nvenc.rate_control.bitrate]
args = ["-rc", "vbr", "-b:v", "{kbps}k"]
help = "Average bitrate (VBR)."

[base.nvenc.rate_control.bitrate.two_pass]
mode = "single_run"
turbo_args = ["-multipass", "qres"]
full_args = ["-multipass", "fullres"]

[base.qsv]
help = "Intel Quick Sync Video (Intel integrated graphics and Arc)."

[base.qsv.presets]
mapping = { kind = "private_opt", name = "preset" }
help = "Target usage: speed against compression."
choices = [
    { value = "veryfast", label = "Very fast" },
    { value = "faster", label = "Faster" },
    { value = "fast", label = "Fast" },
    { value = "medium", label = "Medium" },
    { value = "slow", label = "Slow" },
    { value = "slower", label = "Slower" },
    { value = "veryslow", label = "Very slow" },
]

[base.qsv.rate_control.quality]
kind = "icq"
label = "ICQ"
min = 1
max = 51
step = 1
default = 25
# FFmpeg qsvenc.c select_rc_mode: global_quality > 0 and no maxrate = ICQ (HandBrake does the same).
args = ["-global_quality", "{value}"]
scale = [[1, 1], [25, 22], [28, 24], [51, 51]]
help = "Intelligent constant quality. Lower is better quality and a bigger file."

[base.qsv.rate_control.bitrate]
args = ["-b:v", "{kbps}k"]
help = "Average bitrate (VBR)."

[base.amf]
help = "AMD's hardware encoder (Radeon, Ryzen APUs). Fast; at the same quality the files are larger than with x264 / x265."

[base.amf.presets]
mapping = { kind = "private_opt", name = "quality" }
help = "Speed against quality."
choices = [
    { value = "speed", label = "Speed" },
    { value = "balanced", label = "Balanced" },
    { value = "quality", label = "Quality" },
    { value = "high_quality", label = "High quality" },
]

[base.amf.rate_control.quality]
kind = "qp"
label = "CQ"
min = 0
max = 51
step = 1
default = 25
# HandBrake 1.11.2 encavcodec.c: rc=cqp, qp_i = q, qp_p = q + 2, qp_b = q + 4 (offsets
# scaled down for q <= 8).
args = ["-rc", "cqp", "-qp_i", "{value}", "-qp_p", "{qp_p}", "-qp_b", "{qp_b}"]
derived = { qp_p = { offset = 2, ramp_below = 8, max = 51, integer = true }, qp_b = { offset = 4, ramp_below = 8, max = 51, integer = true } }
scale = [[0, 0], [25, 22], [28, 24], [51, 51]]
help = "Constant QP (I frames; P and B frames get a slightly higher QP, as in HandBrake). Lower is better quality and a bigger file."

[base.amf.rate_control.bitrate]
args = ["-rc", "vbr_peak", "-b:v", "{kbps}k"]
help = "Peak-constrained VBR (as HandBrake)."

[base.vaapi]
help = "VAAPI (Linux): Intel and AMD GPUs through Mesa or the Intel media driver."

[base.vaapi.rate_control.quality]
kind = "qp"
label = "QP"
# Real encodes (radeonsi): `-global_quality 0` means "not set", so the driver picks
# the QP (h264 20, hevc 25, av1 25: the same file as no quality option); 52 gives the same
# file as 51. So 1-51 (av1_vaapi 1-255: 256 gives the same file as 255).
min = 1
max = 51
step = 1
default = 25
# Real encodes (radeonsi): CQP, CBR, VBR, QVBR are supported, ICQ is not. `-global_quality`
# sets the QP in CQP mode for h264, hevc and av1 (av1_vaapi has no `-qp` option).
args = ["-rc_mode", "CQP", "-global_quality", "{value}"]
scale = [[0, 0], [25, 22], [28, 24], [51, 51]]
help = "Constant QP. Lower is better quality and a bigger file."

[base.vaapi.rate_control.bitrate]
args = ["-rc_mode", "VBR", "-b:v", "{kbps}k"]
help = "Average bitrate (VBR)."

