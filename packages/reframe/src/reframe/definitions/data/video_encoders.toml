    { value = "11", label = "11 (fastest)" },
    { value = "10", label = "10" },
    { value = "9", label = "9" },
    { value = "8", label = "8" },
    { value = "7", label = "7" },
    { value = "6", label = "6" },
    { value = "5", label = "5" },
    { value = "4", label = "4" },
    { value = "3", label = "3" },
    { value = "2", label = "2" },
    { value = "1", label = "1" },
    { value = "0", label = "0 (slowest)" },
]

[encoder.libsvtav1.tunes]
# SVT-AV1 v4.2: 0 VQ, 1 PSNR (library default), 2 SSIM, 4 MS-SSIM. Tune 3 (IQ) is for still
# images: "Tune IQ only supports all-intra and low delay … prediction structures".
default = "1"
mapping = { kind = "x26x_param", name = "tune" }
help = "What the encoder optimises for."
choices = [
    { value = "0", label = "Visual quality", help = "Sharper, subjectively better video." },
    { value = "1", label = "PSNR", help = "The library default." },
    { value = "2", label = "SSIM" },
    { value = "4", label = "MS-SSIM" },
]

[encoder.libsvtav1.levels]
mapping = { kind = "x26x_param", name = "level" }
help = "Limits bitrate and resolution for a player class. Auto picks one."
# SVT-AV1 rejects `level=4.1` ("Error parsing option level: 4.1.") and takes `level=41`.
choices = [
    { value = "2.0", label = "2.0", ffmpeg_value = "20" },
    { value = "2.1", label = "2.1", ffmpeg_value = "21" },
    { value = "3.0", label = "3.0", ffmpeg_value = "30" },
    { value = "3.1", label = "3.1", ffmpeg_value = "31" },
    { value = "4.0", label = "4.0", ffmpeg_value = "40" },
    { value = "4.1", label = "4.1", ffmpeg_value = "41" },
    { value = "5.0", label = "5.0", ffmpeg_value = "50" },
    { value = "5.1", label = "5.1", ffmpeg_value = "51" },
    { value = "5.2", label = "5.2", ffmpeg_value = "52" },
    { value = "5.3", label = "5.3", ffmpeg_value = "53" },
    { value = "6.0", label = "6.0", ffmpeg_value = "60" },
    { value = "6.1", label = "6.1", ffmpeg_value = "61" },
    { value = "6.2", label = "6.2", ffmpeg_value = "62" },
    { value = "6.3", label = "6.3", ffmpeg_value = "63" },
]

[encoder.libsvtav1.rate_control.quality]
kind = "crf"
label = "RF"
# FFmpeg's `-crf` is an int from 0 to 63 (HandBrake, which drives SVT directly, allows 70), but
# 0 means "not set": SVT-AV1 v4.2 logs `CRF / 35.00` and writes the same file as no `-crf`
# (both n9.0.2 builds and n8.1.3). So 1-63.
min = 1
max = 63
step = 1
default = 30
args = ["-crf", "{value}"]
scale = [[0, 0], [27, 20], [30, 22], [35, 24], [63, 51]]
help = "Constant rate factor. Lower is better quality and a bigger file."
recommended = [
    { max_height = 576, low = 22, high = 32 },
    { max_height = 720, low = 25, high = 35 },
    { max_height = 1080, low = 25, high = 35 },
    { max_height = 2160, low = 25, high = 40 },
]

[encoder.libsvtav1.rate_control.bitrate]
args = ["-b:v", "{kbps}k"]
help = "Average bitrate (VBR)."

[encoder.libsvtav1.rate_control.bitrate.two_pass]
mode = "two_runs"
args = ["-pass", "{pass}", "-passlogfile", "{passlog}"]

