# 0-255 (the AV1 q index). The initial QPs are the CQ value on the 0-255 scale (x 255/63), with
# the H.265 offsets (-2 / +2 of 51) scaled the same way (-8 / +8 of 255). Not checked on NVIDIA
# hardware.
derived = { qp_i = { factor = 4.047619047619048, offset = -8, min = 0, max = 255, integer = true }, qp_p = { factor = 4.047619047619048, max = 255, integer = true }, qp_b = { factor = 4.047619047619048, offset = 8, max = 255, integer = true } }
