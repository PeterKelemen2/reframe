tune_chains = { film = "nlmeans=s=1.05:p=7:pc=7:r=3:rc=3", grain = "nlmeans=s=1:p=7:pc=7:r=3:rc=3", highmotion = "nlmeans=s=1.05:p=7:pc=7:r=3:rc=5", animation = "nlmeans=s=1.25:p=5:pc=5:r=7:rc=7", tape = "nlmeans=s=1:p=3:pc=5:r=5:rc=5", sprite = "nlmeans=s=1:p=5:pc=5:r=5:rc=7" }

