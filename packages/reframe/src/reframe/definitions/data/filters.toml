chain = "zscale=p=smpte170m:t=bt709:m=smpte170m"

[[filter.colorspace.implementations.presets]]
id = "bt601-6-625"
label = "BT.601 EBU (PAL)"
handbrake = "primaries=bt470bg:transfer=bt709:matrix=smpte170m"
chain = "zscale=p=bt470bg:t=bt709:m=smpte170m"

[[filter.colorspace.implementations.presets]]
id = "custom"
label = "Custom"
custom = true
chain = "zscale={custom}"

[[filter.colorspace.implementations]]
id = "libplacebo"
label = "libplacebo"
