# Filters (C-6, 03 §Filters). Table key = the filter id of `reframe.models.job.FilterSettings`.
#
# Each filter has one or more FFmpeg implementations (FilterConfig.implementation; the first
# is the default), each with its own presets and tunes (HandBrake's names: NLMeans / HQDN3D,
# Bwdif / Yadif, …), and the help panel text of 03 §Filters. A chain is the text of one `-vf`
# segment; `{custom}` is FilterConfig.custom. Every chain was run with
# FFmpeg n9.0.2 (both builds) on `-f lavfi -i testsrc2=size=320x240 … -frames:v 2 -f null -`
# (colour filters on the HDR10 fixture); tests/definitions/test_tools.py repeats it.
#
# HandBrake parity: preset and tune values come from HandBrake 1.11.2 libhb/param.c; each
# preset's `handbrake` field quotes the values it maps from. The mappings:
# - Denoise NLMeans: HandBrake's weight is exp(-SSD / (patch² · strength²)), FFmpeg nlmeans'
#   is exp(-SSD / (10 · s)²) (libavfilter/vf_nlmeans.c), so s = patch · strength / 10 with
#   the luma values, clamped to FFmpeg's 1 … 30. The patch (p / pc) and research window
#   (r / rc) sizes are HandBrake's luma / chroma values. FFmpeg's nlmeans is spatial only and
#   has one strength for all planes, so HandBrake's chroma strength, origin tune, frame count
#   and prefilter have no equivalent (the Grain tune, luma strength 0, becomes the weakest
#   s=1).
# - Denoise HQDN3D: HandBrake's y/cb/cr spatial and temporal strengths map 1:1 to hqdn3d's
#   luma_spatial, chroma_spatial, luma_tmp, chroma_tmp (cb = cr in every preset).
# - Deblock: HandBrake converts its own settings to FFmpeg's deblock filter
#   (libhb/deblock.c): filter = strength, block = blocksize (tune), alpha = thresh · 0.01,
#   beta = gamma = delta = alpha / 2. Reframe writes exactly that.
# - Sharpen (unsharp) and chroma smooth: HandBrake's filters are ports of FFmpeg's unsharp
#   (amount = strength · 65536, size = matrix size), so strength = unsharp amount and size =
#   msize. Chroma smooth is unsharp on the chroma planes with a negative amount
#   (libhb/chroma_smooth.c subtracts); FFmpeg's amount stops at -2, so Very strong (2.4) is
#   written as -2.
# - Deinterlace: HandBrake drives FFmpeg's yadif / bwdif (libhb/deinterlace.c): Default =
#   send_frame, Bob = send_field, Skip spatial check = send_frame_nospatial; interlace
#   detection adds deint=interlaced.
# - Interlace detection: HandBrake's comb detector has no FFmpeg equivalent. Reframe uses
#   idet, which flags the frames it finds interlaced (libavfilter/vf_idet.c sets
#   AV_FRAME_FLAG_INTERLACED), and the deinterlacer then processes only those. "Less
#   sensitive" raises idet's interlace threshold (1.04 → 1.5); "Fast" is the same as
#   Default (idet has no faster mode).
# - Detelecine: HandBrake's pullup settings (skip-*, plane) have no fieldmatch equivalent;
#   Default is FFmpeg's fieldmatch + decimate with their defaults.
# - Colorspace: HandBrake's colorspace presets (primaries / transfer / matrix) become zscale
#   or libplacebo parameters; HandBrake's built-in tone mapping is the separate Tone mapping
#   filter here.

filter_order = [
    "detelecine",
    "interlace_detection",
    "deinterlace",
    "denoise",
    "deblock",
    "crop",
    "custom",
    "scale",
    "tonemap",
    "colorspace",
    "sharpen",
    "chroma_smooth",
    "grayscale",
    "format",
]

# --------------------------------------------------------------------------- detelecine

[filter.detelecine]
label = "Detelecine"

[filter.detelecine.help]
what = "Undoes 3:2 pulldown: rebuilds the original 24 fps film frames from 29.97 fps telecined video and drops the duplicates."
use_when = "NTSC DVDs and broadcasts of film or TV series that show combing in a regular 3-of-5 frame pattern."
avoid_when = "The source is already progressive, true interlaced video (sports, news), or PAL."
speed_cost = "low"
settings = "Default: field matching with FFmpeg's defaults, then one frame in five dropped. Custom: your fieldmatch parameters."

[[filter.detelecine.implementations]]
id = "fieldmatch"
label = "Field match"
filters = ["fieldmatch", "decimate"]
default_preset = "default"

[[filter.detelecine.implementations.presets]]
id = "default"
label = "Default"
handbrake = "skip-top=4:skip-bottom=4:skip-left=1:skip-right=1:plane=0 (pullup; no fieldmatch equivalent)"
chain = "fieldmatch,decimate"

[[filter.detelecine.implementations.presets]]
id = "custom"
label = "Custom"
custom = true
chain = "fieldmatch={custom},decimate"

# --------------------------------------------------------------------------- interlace detection

[filter.interlace_detection]
label = "Interlace detection"
analysis = true

[filter.interlace_detection.help]
what = "Finds interlaced frames, so that Deinterlace processes only those and leaves progressive frames untouched."
use_when = "Mixed sources: progressive video with some interlaced parts (DVD extras, broadcasts)."
avoid_when = "The whole source is interlaced (deinterlace everything instead) or fully progressive."
speed_cost = "low"
settings = "Default: FFmpeg's idet thresholds. Less sensitive: fewer frames count as interlaced. Fast: the same as Default (idet has no faster mode). Custom: your idet parameters."

[[filter.interlace_detection.implementations]]
id = "idet"
label = "idet"
filters = ["idet"]
default_preset = "default"

[[filter.interlace_detection.implementations.presets]]
id = "default"
label = "Default"
handbrake = "mode=3:spatial-metric=2:motion-thresh=1:spatial-thresh=1:filter-mode=2:block-thresh=40:block-width=16:block-height=16"
chain = "idet"

[[filter.interlace_detection.implementations.presets]]
id = "permissive"
label = "Less sensitive"
handbrake = "mode=3:spatial-metric=2:motion-thresh=3:spatial-thresh=3:filter-mode=2:block-thresh=40:block-width=16:block-height=16"
chain = "idet=intl_thres=1.5"

[[filter.interlace_detection.implementations.presets]]
id = "fast"
label = "Fast"
handbrake = "mode=0:spatial-metric=2:motion-thresh=2:spatial-thresh=3:filter-mode=1:block-thresh=80:block-width=16:block-height=16"
chain = "idet"

[[filter.interlace_detection.implementations.presets]]
id = "custom"
label = "Custom"
custom = true
chain = "idet={custom}"

# --------------------------------------------------------------------------- deinterlace

[filter.deinterlace]
label = "Deinterlace"

[filter.deinterlace.help]
what = "Turns interlaced video (two half-pictures per frame) into progressive frames, removing the comb artefacts."
use_when = "DVDs and broadcasts that show combing on motion. With Interlace detection on, only the detected frames are processed."
avoid_when = "Progressive sources: deinterlacing them only softens the picture."
speed_cost = "low"
settings = "Bwdif (the default) or Yadif. Default: one output frame per frame. Bob: one frame per field, double frame rate, smoother motion. Skip spatial check (Yadif): faster. Custom: your bwdif / yadif parameters."

[[filter.deinterlace.implementations]]
id = "bwdif"
label = "Bwdif"
filters = ["bwdif"]
combed_only = "deint=interlaced"
default_preset = "default"
note = "Bob Weaver: sharper than yadif, the default."

[[filter.deinterlace.implementations.presets]]
id = "default"
label = "Default"
handbrake = "bwdif mode=3 (send_frame)"
chain = "bwdif=mode=send_frame:parity=auto"

[[filter.deinterlace.implementations.presets]]
id = "bob"
label = "Bob"
handbrake = "bwdif mode=7 (send_field)"
chain = "bwdif=mode=send_field:parity=auto"

[[filter.deinterlace.implementations.presets]]
id = "custom"
label = "Custom"
custom = true
chain = "bwdif={custom}"

[[filter.deinterlace.implementations]]
id = "yadif"
label = "Yadif"
filters = ["yadif"]
combed_only = "deint=interlaced"
default_preset = "default"
note = "Yet Another Deinterlacing Filter: HandBrake's classic."

[[filter.deinterlace.implementations.presets]]
id = "default"
label = "Default"
handbrake = "yadif mode=3 (send_frame)"
chain = "yadif=mode=send_frame:parity=auto"

[[filter.deinterlace.implementations.presets]]
id = "skip-spatial"
label = "Skip spatial check"
handbrake = "yadif mode=1 (send_frame_nospatial)"
chain = "yadif=mode=send_frame_nospatial:parity=auto"

[[filter.deinterlace.implementations.presets]]
id = "bob"
label = "Bob"
handbrake = "yadif mode=7 (send_field)"
chain = "yadif=mode=send_field:parity=auto"

[[filter.deinterlace.implementations.presets]]
id = "custom"
label = "Custom"
custom = true
chain = "yadif={custom}"

# --------------------------------------------------------------------------- denoise

[filter.denoise]
label = "Denoise"

[filter.denoise.help]
what = "Removes noise and grain. A cleaner picture compresses much better."
use_when = "Noisy sources: old films, low-light video, VHS, DVD with visible noise."
avoid_when = "Clean sources, or grain you want to keep (use the encoder's grain tune or SVT-AV1 film grain instead)."
speed_cost = "high"
settings = "NLMeans (the default): Ultralight to Strong (HandBrake's presets); tunes adapt it to the content. HQDN3D: the same strengths, much faster, can smear at high strength. Custom: your nlmeans or hqdn3d parameters."

[[filter.denoise.implementations]]
id = "nlmeans"
label = "NLMeans"
filters = ["nlmeans"]
default_preset = "light"
note = "Non-local means: the best quality, slow."
tunes = [
    { id = "film", label = "Film", help = "Most content, live action." },
    { id = "grain", label = "Grain", help = "Keeps luma grain; FFmpeg's nlmeans cannot leave luma alone, so it denoises very lightly." },
    { id = "highmotion", label = "High motion", help = "Avoids colour smearing in fast motion." },
    { id = "animation", label = "Animation", help = "Cel animation: cartoons, anime." },
    { id = "tape", label = "Tape", help = "Analogue tape: VHS." },
    { id = "sprite", label = "Sprite", help = "1- to 16-bit 2D games." },
]

