avoid_when = "The output stays HDR (encode 10-bit H.265 or AV1 with HDR metadata instead), or the source is SDR."
speed_cost = "medium"
settings = "libplacebo (the default, needs Vulkan): dynamic peak detection, or Static with the mastering metadata only; tunes pick the curve. zscale + tonemap (CPU): Hable, Mobius or Reinhard, no peak detection."

