# --------------------------------------------------------------------------- colorspace

[filter.colorspace]
label = "Colorspace"

[filter.colorspace.help]
what = "Converts the colour primaries, transfer and matrix to another standard, and tags the output so that players do not have to guess."
use_when = "SD sources (BT.601) for modern players that assume BT.709, or a deliberate BT.2020 output."
avoid_when = "The source already has the target colours. HDR to SDR needs Tone mapping, not only this filter."
speed_cost = "low"
settings = "BT.709: HD and SDR standard. BT.2020: UHD (SDR, 10-bit transfer). BT.601 SMPTE-C: NTSC SD. BT.601 EBU: PAL SD. zscale (the default, CPU) or libplacebo (Vulkan)."

[[filter.colorspace.implementations]]
id = "zscale"
label = "zscale"
filters = ["zscale"]
requires_tagged_input = true
default_preset = "bt709"
note = "CPU conversion (zimg)."

[[filter.colorspace.implementations.presets]]
id = "bt709"
label = "BT.709"
handbrake = "primaries=bt709:transfer=bt709:matrix=bt709"
chain = "zscale=p=bt709:t=bt709:m=bt709"

[[filter.colorspace.implementations.presets]]
id = "bt2020"
label = "BT.2020"
handbrake = "primaries=bt2020:transfer=bt2020-10:matrix=bt2020ncl"
chain = "zscale=p=bt2020:t=bt2020-10:m=bt2020nc"

[[filter.colorspace.implementations.presets]]
id = "bt601-6-525"
label = "BT.601 SMPTE-C (NTSC)"
