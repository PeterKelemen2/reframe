# Output containers. Table key = `reframe.models.job.Container`.
#
# What each muxer takes is checked by tests/definitions/test_tools.py and recorded in
# testdata/README.md ("Verified tool behaviour"). Where FFmpeg accepts more than HandBrake does
# (Vorbis in MP4 with a generic `mp4a` tag), the HandBrake 1.11.2 muxer masks (libhb/common.c
# `hb_audio_encoders`, `hb_video_encoders`) decide.
#
# Codec names are ffprobe `codec_name`s; `copy = ["*"]` means any codec but those in
# `copy_except` (the codecs the muxer refuses).

[container.mkv]
label = "Matroska (MKV)"
muxer = "matroska"
extensions = [".mkv"]
chapters = true
attachments = true
# All six flags are written by FFmpeg (testdata/README.md "Matroska muxer: dispositions").
flags = ["default", "forced", "commentary", "hearing_impaired", "visual_impaired", "original"]
language_format = "iso639_2b"
# A copied mov_text track (from MP4) cannot go into Matroska: it becomes SRT.
text_subtitle_target = "srt"
help = "Holds almost every codec, chapters, attachments (fonts) and all track flags. The best choice for a media library."

[container.mkv.video]
copy = ["*"]
# These mux, but FFmpeg cannot read the file back. RGB rawvideo is refused, and the codec name
# does not tell it from YUV rawvideo, so rawvideo is always encoded.
copy_except = ["dirac", "gif", "qtrle", "rawvideo", "rpza", "svq1"]
encode = ["h264", "hevc", "av1", "vp9"]

[container.mkv.audio]
copy = ["*"]
# "No wav codec tag found for codec …" (exit 234): no Matroska codec ID and no WAVE format tag.
# `dfpwm` muxes, but FFmpeg cannot read the file back. The unverified ones are denied to be
# safe: they are encoded, never a failed mux.
copy_except = [
    # PCM-like
    "pcm_bluray", "pcm_dvd", "s302m", "pcm_s24daud", "pcm_vidc",
    "pcm_s8", "pcm_s8_planar", "pcm_s16le_planar", "pcm_s16be_planar",
    "pcm_s24le_planar", "pcm_s32le_planar", "pcm_s64be",
    "pcm_u16le", "pcm_u16be", "pcm_u24le", "pcm_u24be", "pcm_u32le", "pcm_u32be",
    "pcm_f32be", "pcm_f64be",
    "dsd_lsbf_planar", "dsd_msbf_planar",
    # other codecs with an FFmpeg encoder
    "adpcm_adx", "adpcm_argo", "adpcm_g726le", "adpcm_ima_alp", "adpcm_ima_amv",
    "adpcm_ima_apm", "adpcm_ima_qt", "adpcm_ima_ssi", "adpcm_ima_ws", "aptx", "aptx_hd",
    "comfortnoise", "dfpwm", "gsm", "nellymoser", "roq_dpcm", "sbc",
    # not verified (no stream could be made)
    "pcm_f16le", "pcm_f24le", "pcm_lxf", "pcm_sga", "dsd_lsbf", "dsd_msbf",
]
encode = ["aac", "ac3", "eac3", "opus", "flac", "mp3"]

[container.mkv.subtitles]
# mov_text cannot go into Matroska ("Subtitle codec mov_text … is not supported"): convert it.
# PGS: FFmpeg has no PGS encoder to test with; libavformat/matroskaenc.c maps it to S_HDMV/PGS.
copy = ["subrip", "ass", "webvtt", "hdmv_pgs_subtitle", "dvd_subtitle", "dvb_subtitle"]
encode = ["srt", "ass", "webvtt"]

[container.mp4]
label = "MP4"
muxer = "mp4"
extensions = [".mp4", ".m4v"]
chapters = true
# "Could not find tag for codec ttf … codec not currently supported in container".
attachments = false
# Written and read back: default, forced, comment, hearing_impaired (ffprobe also shows
# captions), visual_impaired (also descriptions). `original` is not written.
flags = ["default", "forced", "commentary", "hearing_impaired", "visual_impaired"]
# With no default track of a type, the MP4 muxer marks the first one default.
language_format = "iso639_2t"
# Text subtitles (SRT, ASS, WebVTT) are converted to mov_text.
text_subtitle_target = "mov_text"
# HandBrake writes H.265 in MP4 as `hvc1` (Apple players need it); FFmpeg's default is `hev1`.
codec_tags = { hevc = "hvc1" }
format_flags = { web_optimized = ["-movflags", "+faststart"] }
help = "Plays on almost everything, including Apple devices and browsers. Text subtitles become mov_text; PGS cannot be copied."

[container.mp4.video]
copy = ["h264", "hevc", "av1", "vp9", "mpeg1video", "mpeg2video", "mpeg4", "mjpeg"]
encode = ["h264", "hevc", "av1", "vp9"]

[container.mp4.audio]
copy = ["aac", "ac3", "eac3", "mp3", "opus", "flac", "alac", "dts", "truehd", "pcm_s16le", "pcm_s24le", "pcm_s32le"]
encode = ["aac", "ac3", "eac3", "opus", "flac", "mp3"]
# "truehd in MP4 support is experimental, add '-strict -2' if you want to use it."
copy_args = { truehd = ["-strict", "-2"] }

[container.mp4.subtitles]
# PGS has no MP4 tag (libavformat/movenc.c codec_mp4_tags); VobSub muxes as `mp4s`.
copy = ["mov_text", "dvd_subtitle"]
encode = ["mov_text"]

[container.webm]
label = "WebM"
muxer = "webm"
extensions = [".webm"]
chapters = true
# The WebM muxer drops attachments without an error (libavformat/matroskaenc.c).
attachments = false
# Only FlagDefault and FlagForced are written (the WebM subset of Matroska).
flags = ["default", "forced"]
language_format = "iso639_2b"
text_subtitle_target = "webvtt"
help = "For the web: VP9 or AV1 video, Opus or Vorbis audio, WebVTT subtitles."

[container.webm.video]
copy = ["vp8", "vp9", "av1"]
encode = ["vp9", "av1"]

[container.webm.audio]
copy = ["opus", "vorbis"]
encode = ["opus"]

[container.webm.subtitles]
copy = ["webvtt"]
encode = ["webvtt"]

# The FFmpeg disposition of each track flag.

[flag.default]
disposition = "default"

[flag.forced]
disposition = "forced"

[flag.commentary]
disposition = "comment"

[flag.hearing_impaired]
disposition = "hearing_impaired"

[flag.visual_impaired]
disposition = "visual_impaired"

[flag.original]
disposition = "original"
