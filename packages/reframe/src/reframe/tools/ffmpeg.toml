# Pinned FFmpeg builds.
#
# CI and `reframe tools fetch` use this file, so the tests run against the builds that
# users download.
# `scripts/fetch-tools.py` downloads a build, verifies the SHA-256 before it extracts anything,
# and checks that `ffmpeg -version` / `ffprobe -version` print `version` below.
# See tools/README.md for how to update a pin.
#
# Source of the builds: BtbN/FFmpeg-Builds (now github.com/FFmpeg-Builds/FFmpeg-Builds; the
# URLs below redirect there), release-branch "gpl-shared" variant (`ffmpeg` and `ffprobe` share
# one set of libav* libraries). Chosen and tested on real hosts in decision 0002.
#
# Retention (BtbN README, "Release Retention Policy", checked 2026-10-11): the last build of
# each month is kept for two years, only the last 14 daily builds are kept, and "latest" floats.
# So pin only a month-end autobuild. autobuild-2026-09-30-13-08 is the last build of
# September 2026: it should stay downloadable until about 2028-09. Re-pin (or mirror the
# archives) before then.

schema_version = 1

# The recommended build, the one that the main CI jobs test against.
[builds.default]
description = "Recommended build: BtbN FFmpeg-Builds, release/9.0, GPL, shared libraries"
# The user may choose it: the first-run screen and Settings → Tools show `label` and `summary`.
offered = true
label = "Recommended"
summary = "The build Reframe is tested with. NVIDIA NVENC needs driver 610 or newer."
# `version` is the exact string that `ffmpeg -version` and `ffprobe -version` print after
# "ffmpeg version " / "ffprobe version ": the describe string of the source commit plus the
# build date that BtbN adds with --extra-version. fetch-tools.py checks it after every fetch.
version = "n9.0.2-17-g2a571b6068-20260930"
# The upstream release the build is based on (for the minimum-version check, >= 7.0).
release_version = "9.0.2"
release_tag = "autobuild-2026-09-30-13-08"
release_url = "https://github.com/BtbN/FFmpeg-Builds/releases/tag/autobuild-2026-09-30-13-08"
checksums_url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/checksums.sha256"
variant = "gpl-shared"
# Built with --enable-gpl --enable-version3, so the binaries are GPL-3.0-or-later.
license = "GPL-3.0-or-later"
license_file = "LICENSE.txt"
# Corresponding source (GPL obligations): the FFmpeg commit, plus the BtbN
# build scripts at the commit of the release tag, which pin the source of every dependency.
source_repository = "https://github.com/FFmpeg/FFmpeg"
source_branch = "release/9.0"
source_commit = "2a571b606854520cf89804d8030c8b328e621689"
build_scripts_repository = "https://github.com/BtbN/FFmpeg-Builds"
build_scripts_commit = "6c9aec5fc9a72ec3abedd1fa84db141fa18cf52b"

[builds.default.platforms.linux-x64]
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-shared-9.0.tar.xz"
sha256 = "01a9764d0b5364b66cfeb4617557c64321b0e232e172ec73f0a701c5f7694326"
size = 68653636
format = "tar.xz"
# Every member of the archive is under this folder. The binaries find the shared libraries in
# ../lib through their RPATH ($ORIGIN/../lib), so the layout must stay as it is in the archive.
root = "ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-shared-9.0"
bin_dir = "bin"
ffmpeg = "bin/ffmpeg"
ffprobe = "bin/ffprobe"

# For arm64 Linux (a server or the arm64 Docker image downloads it); the desktop packages
# are x64 only.
[builds.default.platforms.linux-arm64]
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linuxarm64-gpl-shared-9.0.tar.xz"
sha256 = "706ccdbc8b0537646345532713a9b6750c0a6258cc001ec1c0379754f0ae730a"
size = 57679524
format = "tar.xz"
root = "ffmpeg-n9.0.2-17-g2a571b6068-linuxarm64-gpl-shared-9.0"
bin_dir = "bin"
ffmpeg = "bin/ffmpeg"
ffprobe = "bin/ffprobe"

[builds.default.platforms.windows-x64]
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0.zip"
sha256 = "3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696"
size = 86321582
format = "zip"
# The DLLs are in bin/, next to the executables.
