[project]
name = "reframe-server"
dynamic = ["version"]
description = "Reframe web server: FastAPI + WebSocket transport over the reframe core"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [{ name = "Peter Kelemen" }]
dependencies = ["reframe"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/reframe_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reframe_server"]
