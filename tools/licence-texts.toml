[data."Wiktionary: List of languages"]
version = "as in language_data 1.4.0 (data/wiktionary/codes-en.csv)"
license = "CC-BY-SA (Creative Commons Attribution-ShareAlike)"
url = "https://en.wiktionary.org/wiki/Wiktionary:List_of_languages"
source = "https://en.wiktionary.org/wiki/Wiktionary:Copyrights (read 2026-11-15)"
text = '''
Reframe's language name search (language-search.json.gz) also finds the language names of
Wiktionary's list of languages, "Wiktionary:List of languages" by the Wiktionary contributors
(https://en.wiktionary.org/wiki/Wiktionary:List_of_languages; its page history names them),
from the copy that language_data 1.4.0 carries. Reframe has modified the list: it takes the
codes and names only, folds the names for search and merges them with the CLDR and IANA names.

Wiktionary's text is licensed under the Creative Commons Attribution-ShareAlike licence and the
GNU Free Documentation License (https://en.wiktionary.org/wiki/Wiktionary:Copyrights; today
CC BY-SA 4.0 International, https://creativecommons.org/licenses/by-sa/4.0/). The names that
Reframe's search table takes from the list are under that licence.
'''

