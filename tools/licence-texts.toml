# Licence texts that the notices cannot find by themselves: npm and PyPI packages whose installed
# copy has no licence file (pip-licenses and license-checker find no text), and archives of the
# sources release whose licence is only in their files' headers (sources-fetch.py finds no
# licence file). scripts/third-party-notices.py takes the text of the first matching name (a
# glob) and stops when a part has neither; sources-fetch.py stops on such an archive. Find the
# licence upstream (at the version given) and add it here; `source` says where it was read. The
