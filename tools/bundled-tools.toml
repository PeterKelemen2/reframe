# The pinned MediaInfo build that the Windows desktop package bundles, and the libva source that
# the Linux layout builds.
#
# `scripts/bundle-tools.py` downloads each archive, verifies its size and SHA-256 before it
# extracts anything, and keeps only the files listed in `files` (the binary, what it needs to
# run, and its licence). Linux packages bundle no MediaInfo: it comes from the distro there
# (`Recommends: mkvtoolnix, mediainfo`). No package bundles MKVToolNix: its Windows build links
# OpenSSL (Apache-2.0) into GPL-2.0-only code, so users install it (decision 0079, item 11).
# See tools/README.md for how to update a pin.
#
# Retention (checked 2026-11-12): mediaarea.net/download/binary/mediainfo/ still lists every
# release since 0.6.1.1.

schema_version = 1

[tools.mediainfo]
description = "MediaInfo CLI 26.10, 64-bit"
# What `mediainfo --Version` prints after "MediaInfoLib - v".
version = "26.10"
release_url = "https://mediaarea.net/en/MediaInfo/Download/Windows"
# MediaArea publishes no checksum: the SHA-256 is of two downloads made eight days apart
# (2026-11-04 on the Windows test VM, 2026-11-12 on the build host), which were equal.
license = "BSD-2-Clause"
license_file = "LICENSE"
source_url = "https://mediaarea.net/download/binary/mediainfo/26.10/MediaInfo_CLI_26.10_GNU_FromSource.tar.xz"
# MediaArea publishes no checksum: the SHA-256 of a download on 2026-11-14.
source_sha256 = "7785bb75d69efd21b7c0b2c2269164aeb21cea2be6f6b9103ad79743af6fdec7"
source_repository = "https://github.com/MediaArea/MediaInfo"
source_tag = "v26.10"

[tools.mediainfo.platforms.windows-x64]
url = "https://mediaarea.net/download/binary/mediainfo/26.10/MediaInfo_CLI_26.10_Windows_x64.zip"
sha256 = "4cc94bd272903914c04f4f9a9f53a6c94b5ea6c6454cf738d29fa182c41e8a29"
size = 4186111
format = "zip"
# The archive has no top folder: its files are at the top level.
binary = "MediaInfo.exe"
# MediaInfo.exe reads local files without LIBCURL.DLL (it needs it only for URLs).
# License.html lists the licences of the libraries built into it.
files = ["MediaInfo.exe", "LICENSE", "License.html"]

# The BtbN Linux build loads the system's libva at run time and calls functions that the libva
# of Ubuntu 22.04 / 24.04 and Debian 12 lacks (vaMapBuffer2), so the Linux layout ships its own,
# built from source by scripts/bundle-tools.py (DRM only) into the FFmpeg folder's lib/, where
# the build finds it first. A VA driver built against a newer VA-API than this libva's is not
# loaded, so keep this pin at the newest libva release. Build it on the oldest supported distro
# (its glibc is the one the library needs).
[libraries.libva]
description = "libva 2.24.1 (VA-API 1.24), DRM only"
version = "2.24.1"
release_url = "https://github.com/intel/libva/releases/tag/2.24.1"
license = "MIT"
license_file = "COPYING"
source_repository = "https://github.com/intel/libva"
source_tag = "2.24.1"

[libraries.libva.platforms.linux-x64]
# The release's own tarball; its SHA-256 equals the release asset's digest on GitHub.
url = "https://github.com/intel/libva/releases/download/2.24.1/libva-2.24.1.tar.bz2"
sha256 = "eec6050b52876f229bd35e9df17cd31a06785e18e6f7990c445b584628483d67"
size = 557422
format = "tar.bz2"
root = "libva-2.24.1"
