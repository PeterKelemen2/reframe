[package]
name = "reframe-spike"
version = "0.0.0"
description = "D-0 spike: a minimal Tauri 2 shell around the frozen reframe-server"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
libc = "0.2"
