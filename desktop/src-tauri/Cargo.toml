[package]
name = "reframe-desktop"
version = "0.1.0"
description = "Reframe desktop app: a Tauri 2 shell around the frozen reframe-server"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4.3"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"

[target.'cfg(windows)'.dependencies]
dirs = "7.0.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
